name: Proof

# Nightly proof-export gate. `tests/proof_spec.rs` emits Lean
# (`aver proof <example> --target lean` → `lake build`) and Dafny
# (`aver proof --backend dafny` → `dafny verify`) on the real
# `examples/formal/` corpus. The job installs both toolchains and
# runs the same `cargo test --test proof_spec` invocation — the
# Dafny arm is conditional on `dafny --version` succeeding, so
# whether we install it here is the only thing standing between
# "tested" and "silently skipped".
#
# Runs per-PR AND nightly. A proof-codegen / proof-metric drift —
# e.g. the platform-sensitive quicksort Dafny error count (#342) —
# is caught at PR time, not only on the next morning's nightly. The
# per-PR run pays the Lean + Dafny toolchain install up front (the
# reason this was nightly-only before); the nightly stays to verify
# the tip of main against toolchain / Z3-image bumps no PR touches.

on:
  # Per-PR + main-push so a proof-codegen / proof-metric drift is
  # caught at PR time, same convention as `ci.yml`.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC daily — still runs against the tip of main (catches
    # toolchain / Z3-image bumps that no PR touches), same as fuzz
    # nightly.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-export:
    name: Proof Export (Lean + Dafny)
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Lean (via elan)
        # Elan with a real default toolchain — `--default-toolchain none`
        # leaves `lake` as a wrapper that errors on every call because
        # it has no toolchain to delegate to (works for a project dir
        # with its own `lean-toolchain` file, broken for the upfront
        # `lake --version` sanity check). Pinning `stable` makes the
        # bare-PATH lake binary executable; emitted proof projects with
        # a different `lean-toolchain` still trigger elan to fetch the
        # matching version on first `lake build`.
        run: |
          # `curl | sh` hides a failing curl behind a shell that succeeds on
          # empty input, so the retry below could not see it without this.
          set -o pipefail
          # elan's own download of the toolchain tarball runs its own curl
          # with no retry, so flags on the installer fetch do not cover it.
          # A transient 503 from the releases CDN therefore failed the job
          # outright; retry the whole install instead.
          for attempt in 1 2 3 4; do
            if curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
                 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                 | sh -s -- -y --default-toolchain stable; then break; fi
            if [ $attempt -eq 4 ]; then exit 1; fi
            echo "elan install failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify `lake` reachable and materialize the pinned toolchain
        # The first lake/lean invocation lazily fetches a toolchain from
        # releases.lean-lang.org; that download has no built-in retry and fails
        # on transient network blips (the same failure mode the Dafny arm
        # already hardens against with `curl --retry`).
        #
        # `lake --version` only warms the *default* toolchain that elan was
        # installed with. The reserved-token probe below runs Lean at the
        # version pinned for the certificate wall, and that one was still being
        # fetched lazily — from inside `cargo test`, where no retry can reach
        # it. A run died exactly there:
        #
        #   downloading .../lean-4.32.2-linux.tar.zst
        #   error: [52] Server returned nothing (Empty reply from server)
        #
        # So warm the pinned toolchain here too, under the same retry, and read
        # the version from the file that defines it rather than repeating it.
        run: |
          pinned="$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "pinned toolchain: ${pinned}"
          for attempt in 1 2 3 4 5 6; do
            if lake --version && elan toolchain install "${pinned}"; then exit 0; fi
            echo "::warning::toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::toolchain unreachable after 6 attempts"
          exit 1

      - name: Check reserved-token snapshot against pinned Lean
        # The guard test in src/codegen/lean/syntax.rs asks the pinned Lean
        # toolchain for its token table and fails when the LEAN_RESERVED
        # snapshot is missing entries. It silently skips when `lean` is not
        # on PATH, and no other lane runs the lib tests with Lean installed —
        # this job is the only place the tripwire can actually fire.
        run: cargo test -p aver-lang --lib -- reserved_snapshot_covers_pinned_lean_token_table

      - name: Install Dafny
        # Manual download of the self-contained (62 MB — bundles its own
        # .NET runtime and Z3) Dafny release zip, replacing
        # dafny-lang/setup-dafny-action. Two reasons:
        #   1. Robustness. The action's internal 3x retry gave up after
        #      ~40s on a transient GitHub-releases CDN 504 and failed the
        #      nightly; `curl --retry 6 --retry-all-errors` rides a
        #      multi-minute CDN blip instead.
        #   2. Node-20 EOL. The action is pinned at v1.9.1 (no newer
        #      release) and its internal setup-node@v4 / setup-dotnet@v4
        #      are Node-20 only — GitHub force-migrates those to Node-24
        #      on 2026-06-16 and removes Node-20 on 2026-09-16. A self-
        #      contained zip needs no dotnet, so a plain download + PATH
        #      sidesteps the whole chain.
        # The next step double-checks the install via `dafny --version`
        # (which `tests/proof_spec.rs` also gates the Dafny arms on). Keep
        # the version in lockstep with the macOS Homebrew Dafny local
        # contributors use so `cargo test --test proof_spec` behaves
        # identically dev + CI (4.11.0 closes quicksort + rle within the
        # 5-budget where 4.9.0 left 2 undischarged).
        env:
          DAFNY_VERSION: '4.11.0'
        run: |
          set -euo pipefail
          url="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/dafny.zip "$url"
          unzip -q /tmp/dafny.zip -d "$HOME/dafny-install"
          dafny_dir="$(dirname "$(find "$HOME/dafny-install" -name dafny -type f | head -1)")"
          chmod +x "$dafny_dir/dafny" || true
          echo "$dafny_dir" >> "$GITHUB_PATH"

      - name: Verify `dafny` reachable
        run: dafny --version

      - name: Check the Dafny prelude against the installed Dafny
        # Same shape as the Lean reserved-token step above: a guard test in
        # src/codegen/dafny/mod.rs feeds every helper block to `dafny
        # verify` at once and skips silently when `dafny` is not on PATH.
        # No other lane runs the lib tests with Dafny installed, and no
        # export fixture reaches the blocks nothing in the corpus triggers,
        # so this job is the only place the tripwire can fire.
        run: |
          out=$(cargo test -p aver-lang --lib -- every_dafny_helper_block_verifies_together 2>&1)
          echo "$out"
          # `cargo test` exits 0 when the filter matches nothing, which would
          # silently retire the only lane that runs the prelude through a real
          # `dafny verify`. Require the test to have actually run.
          echo "$out" | grep -q "test result: ok. 1 passed" || { echo "guard test did not run"; exit 1; }

      - name: Run proof-export tests
        # Restricting to these targets keeps this job short (no overlap
        # with the lib / wasm / bench jobs). Lean and Dafny arms are
        # interleaved inside individual #[test] fns; the test harness
        # picks whichever toolchains are on PATH.
        #
        # `map_iteration_order` is here for the tests that need a real
        # verifier run: the export-refusal accounting (does a declined
        # claim reach the exit code?) only exists once `--check` has a
        # verifier to invoke, so those tests skip themselves on the main
        # test lane, where `lake` is not installed. This is the lane
        # where their guard opens.
        run: cargo test -p aver-lang --test proof_spec --test map_iteration_order
