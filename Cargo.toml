[workspace]
members = [".", "aver-lsp", "aver-rt", "aver-memory"]
exclude = ["tools/wasm-runner"]

[package]
name = "aver-lang"
version = "0.9.0"
edition = "2024"
default-run = "aver"
description = "VM and transpiler for Aver, a statically-typed language designed for AI-assisted development"
license = "MIT"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-lang"
readme = "README.md"
keywords = ["language", "interpreter", "transpiler", "programming-language"]
categories = ["compilers"]
include = [
    "/src/**",
    "/self_hosted/**",
    "!/src/bin/**",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "aver"

[[bin]]
name = "aver"
path = "src/main.rs"

[features]
default = ["terminal"]
terminal = ["aver-rt/terminal"]
wasm = ["dep:wasm-encoder", "dep:wasmtime"]

[dependencies]
aver-memory = { path = "aver-memory", version = "=0.1.0", features = ["runtime"] }
aver-rt = { path = "aver-rt", version = "=0.4.0", features = ["http", "random"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
thiserror = "1"
toml = "0.8"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-encoder = { version = "0.225", optional = true }
wasmtime = { version = "29", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "nan_value_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
