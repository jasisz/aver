[workspace]
members = [".", "aver-lsp", "aver-rt"]

[package]
name = "aver-lang"
version = "0.5.5"
edition = "2024"
default-run = "aver"
description = "Interpreter and transpiler for Aver, a statically-typed language designed for AI-assisted development"
license = "MIT"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-lang"
readme = "README.md"
keywords = ["language", "interpreter", "transpiler", "programming-language"]
categories = ["compilers"]
include = [
    "/src/**",
    "!/src/bin/**",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "aver"

[[bin]]
name = "aver"
path = "src/main.rs"

[features]
default = ["terminal"]
terminal = ["aver-rt/terminal"]

[dependencies]
aver-rt = { path = "aver-rt", version = "=0.2.2", features = ["http", "random"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
thiserror = "1"
toml = "0.8"
im = "15"
url = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "interpreter_bench"
harness = false

[[bench]]
name = "nan_value_bench"
harness = false
