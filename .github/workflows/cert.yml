name: Certification

on:
  pull_request:
    branches: [main]
  # The full matrix runs on a timer rather than on every push to main. It is
  # 330 minutes of kernel work across 30 lanes, on a runner pool shared with
  # every other workflow here, so paying it per push made each pull request
  # queue behind roughly forty minutes of certification that almost never
  # changed. The guard in `decide` skips the run outright when main has not
  # moved since the last one, so a quiet stretch costs nothing.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    name: Decide lanes
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the lane partitions still cover every test
        run: |
          python3 - <<'EOF'
          import json, re, sys
          lanes = json.load(open('.github/cert-lanes.json'))
          # The comment on cert-kernel promises each suite's shards are disjoint
          # and exhaustive — no overlap doubling kernel work, no gap silently
          # dropping a soundness gate. That held while the shards sat in the
          # matrix literal and a reviewer could see them together; now they live
          # in a data file, so the promise is checked instead of stated.
          groups = {}
          for lane in lanes:
              part = lane.get('partition')
              if not part:
                  continue
              k, n = (int(x) for x in part.split('/'))
              family = re.sub(r'-\d+/\d+$', '', lane.get('lane') or '')
              groups.setdefault((lane['suite'], family, n), set()).add(k)
          bad = []
          for (suite, family, n), seen in sorted(groups.items()):
              if seen != set(range(1, n + 1)):
                  bad.append(f"{suite} {family}: expected 1..{n}, got {sorted(seen)}")
          if not any(lane.get('smoke') for lane in lanes):
              bad.append("no lane is marked smoke — every pull request would run nothing")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(lanes)} lanes, {len(groups)} partitioned families, all complete")
          EOF

      - name: Pick lanes for this event
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A pull request runs the smoke lanes only: the five cheapest that
          # still reach all four suites, about five minutes of wall clock. They
          # are marked in .github/cert-lanes.json rather than listed here, so
          # the full set stays the single source and a lane cannot be dropped
          # from one place and kept in the other.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "lanes=$(jq -c '[.[] | select(.smoke)]' .github/cert-lanes.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: certify main only if it moved. `head_sha` of the last
          # successful scheduled run is the last commit this suite passed on.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/cert.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$last" = "${{ github.sha }}" ]; then
              echo "main unchanged since ${last} — nothing to certify"
              echo "lanes=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "lanes=$(jq -c '.' .github/cert-lanes.json)" >> "$GITHUB_OUTPUT"

  cert-kernel:
    needs: decide
    if: needs.decide.outputs.lanes != '[]'
    # Every lane is a name filter plus a slice partition. Each filter and its
    # suite-specific complement are disjoint and exhaustive, so each test in a
    # suite is selected exactly once: no overlap (which would double the kernel
    # work) and no gap (which would silently stop running a soundness gate).
    #
    # Four families are prefix-selected onto dedicated runners because their
    # members are long kernel runs:
    #   * `cert_hostile_model_` (certify) — the hostile obligation-model gates;
    #   * `cert_adt_witness_`   (certify) — one `lake build` of an emitted
    #     certificate per non-recursive ADT fixture, ten of them;
    #   * `cert_plans_authority_` (verify) — the Plans.lean-authority gates,
    #     one full certificate verification each;
    #   * `cert_tripwire_` (verify) — the tampering classes of `aver cert
    #     verify`, one gate per test. Twenty-three of them pay a full artifact
    #     DATA build (a tamper of Lean source inside the certificate, or a gate
    #     that must be ACCEPTED); the other nine are decided by the Rust
    #     verifier before any Lean process starts and cost milliseconds. Slice
    #     partitioning is round-robin over the sorted names, which spreads the
    #     expensive ones four or five to a lane.
    # The `rest` lane of each suite excludes exactly those prefixes. Prefix in,
    # prefix out. A model or fixture added to the lists inside a suite lands in
    # an existing shard test, so these lanes never need editing for coverage —
    # only to add throughput.
    name: Cert Kernel (${{ matrix.suite }}${{ matrix.lane && format(' {0}', matrix.lane) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.lanes) }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Lean toolchain
        # The verifier's production default remains a clean Lake build. Tests
        # may copy an exact-byte-keyed pristine prelude cache into fresh builds;
        # the Lean toolchain download is cached separately here.
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/lean-toolchain') }}

      - name: Install Lean (via elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache wasm-tools
        id: cache-wasm-tools
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-1.246.2

      - name: Install wasm-tools
        # Retrying was not enough on its own: a run burned all six attempts
        # over ninety seconds against a releases CDN that stayed down for
        # longer than that. A pinned binary does not need re-fetching every
        # run, so the cache above removes the download from the common path
        # and the retry only covers a genuine cache miss.
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools "$HOME/.local/bin/wasm-tools"

      - name: Put wasm-tools on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-tools" --version

      - name: Verify pinned `lake` reachable
        run: |
          toolchain="$(tr -d '\r\n' < aver-cert/assets/wall/current/lean-toolchain)"
          for attempt in 1 2 3 4 5 6; do
            if elan run --install "$toolchain" lake --version; then exit 0; fi
            echo "::warning::pinned lake/toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::pinned lake unreachable after 6 attempts (toolchain download)"
          exit 1

      - name: Cache prebuilt prelude store
        # The test harness's exact-byte-keyed pristine prelude store: a stale
        # or mismatching entry is a harmless miss (the key is a content hash of
        # the staged audited bytes), so caching across runs only saves the
        # per-job pristine build.
        uses: actions/cache@v4
        with:
          path: /tmp/aver-cert-prelude-store
          key: prelude-store-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/**', 'aver-cert/src/verifier.rs', 'aver-cert/src/prelude_cache.rs', 'aver-cert/src/lean_process.rs') }}

      - name: Install nextest
        if: matrix.mode == 'nextest'
        uses: taiki-e/install-action@nextest

      - name: Build standalone certificate verifier
        run: cargo build -p aver-cert --bin aver-cert

      - name: Verify hostile Lean search paths are isolated
        if: matrix.suite == 'cert_decode_spec'
        env:
          AVER_CERT_REQUIRE_PINNED_LEAN: '1'
        run: >-
          cargo test -p aver-cert --lib --features verify
          lean_process::tests::hostile_lean_path_olean_is_not_visible -- --exact

      - name: Run certification suite
        if: matrix.mode == 'cargo'
        run: cargo test -p aver-lang --features wasm --test ${{ matrix.suite }}

      - name: Run certification suite lane
        # Filtering happens before slice partitioning. Each family filter (one
        # of the `cert_hostile_model_`, `cert_adt_witness_`, `cert_tripwire_`
        # and `cert_plans_authority_` prefixes) and its suite-specific
        # complement are disjoint and exhaustive.
        if: matrix.mode == 'nextest'
        run: >-
          cargo nextest run -p aver-lang --features wasm --test ${{ matrix.suite }}
          -E '${{ matrix.filter }}'
          --partition slice:${{ matrix.partition }}
