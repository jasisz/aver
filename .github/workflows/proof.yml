name: Proof

# Proof-export gate. `tests/proof_spec.rs` emits Lean
# (`aver proof <example>` → `lake build`) on the real
# `examples/formal/` corpus. The job installs the Lean toolchain and
# partitions proof-export test cases with nextest. The Lean arms skip
# when `lake` is missing, so a developer without Lean can run them; this
# job sets `AVER_CERT_REQUIRE_LEAN=1`, which turns that skip into a
# failure, so a broken Lean install cannot pass as a green run.
#
# Runs per-PR AND nightly. A proof-codegen / proof-metric drift is
# caught at PR time, not only on the next morning's nightly. The
# per-PR run pays the Lean toolchain install up front (the reason
# this was nightly-only before); the nightly stays to verify the tip
# of main against toolchain bumps no PR touches.

on:
  # Per-PR + main-push so a proof-codegen / proof-metric drift is
  # caught at PR time, same convention as `ci.yml`.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC daily — still runs against the tip of main (catches
    # toolchain bumps that no PR touches), same as fuzz
    # nightly.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A newer push to the same pull request, or a newer commit on main,
# supersedes a run still in progress: only the latest one is worth a runner.
# Nightly, dispatched and release runs keep their own group and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-lanes:
    name: Proof Export (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    # The monolithic job timed out after 30 minutes on PR #1370 with no
    # failing case. Partition test cases (not files) so the large proof_spec
    # binary spreads across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    env:
      # Lean is installed on these runners, so a Lean-backed test that finds
      # no `lake` or `lean` fails instead of skipping (tests/support/lean_required.rs).
      AVER_CERT_REQUIRE_LEAN: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      - name: Install Lean (via elan)
        # Keep a default for test helpers that check Lake outside a project.
        # The lake_toolchain regression separately runs the proof CLI with an
        # isolated Elan home and no default: the generated project's pin must
        # govern both availability checks and builds in that environment.
        run: |
          # `curl | sh` hides a failing curl behind a shell that succeeds on
          # empty input, so the retry below could not see it without this.
          set -o pipefail
          # elan's own download of the toolchain tarball runs its own curl
          # with no retry, so flags on the installer fetch do not cover it.
          # A transient 503 from the releases CDN therefore failed the job
          # outright; retry the whole install instead.
          for attempt in 1 2 3 4; do
            if curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
                 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                 | sh -s -- -y --default-toolchain stable; then break; fi
            if [ $attempt -eq 4 ]; then exit 1; fi
            echo "elan install failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify `lake` reachable and materialize the pinned toolchain
        # The first lake/lean invocation lazily fetches a toolchain from
        # releases.lean-lang.org; that download has no built-in retry and fails
        # on transient network blips.
        #
        # `lake --version` only warms the *default* toolchain that elan was
        # installed with. The reserved-token probe below runs Lean at the
        # version pinned for the certificate wall, and that one was still being
        # fetched lazily — from inside `cargo test`, where no retry can reach
        # it. A run died exactly there:
        #
        #   downloading .../lean-4.32.2-linux.tar.zst
        #   error: [52] Server returned nothing (Empty reply from server)
        #
        # So warm the pinned toolchain here too, under the same retry, and read
        # the version from the file that defines it rather than repeating it.
        run: |
          pinned="$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "pinned toolchain: ${pinned}"
          for attempt in 1 2 3 4 5 6; do
            if lake --version && elan toolchain install "${pinned}"; then exit 0; fi
            echo "::warning::toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::toolchain unreachable after 6 attempts"
          exit 1

      - name: Run Lean-backed unit tests against pinned Lean
        if: matrix.shard == 1
        # The guard test in src/codegen/lean/syntax.rs asks the pinned Lean
        # toolchain for its token table and fails when the LEAN_RESERVED
        # snapshot is missing entries; the other two run small Lean files
        # through the pinned toolchain. They skip when `lean` is not on PATH,
        # and no other lane runs the lib tests with Lean installed — this job
        # is the only place they can actually fire.
        run: >-
          cargo test -p aver-lang --lib --
          reserved_snapshot_covers_pinned_lean_token_table
          citation_probe_audits_actual_closures_through_globals_and_local_lets
          definitional_unfolding_keeps_decidable_instances_valid_for_rewrite_and_apply

      - name: Check the new steps-level laws under Lean
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        # The steps ratchet in ci.yml credits laws the kernel written in Aver
        # closes. Every law this pull request adds to that level in
        # tools/steps-baseline.json is checked under Lean too, only in the
        # files that gained one, so the Aver kernel alone never earns it.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:tools/steps-baseline.json" > "$RUNNER_TEMP/base-steps-baseline.json"
          cargo build -p aver-lang --bin aver
          python3 tools/steps_ratchet.py --aver target/debug/aver --lean-gains "$RUNNER_TEMP/base-steps-baseline.json"

      - name: Run proof-export tests
        # Restricting to these targets keeps this job short (no overlap
        # with the lib / wasm / bench jobs). `AVER_CERT_REQUIRE_LEAN=1` makes
        # a Lean arm that finds no `lake` fail rather than skip.
        #
        # `map_iteration_order` is here for the tests that need a real
        # verifier run: the export-refusal accounting (does a declined
        # claim reach the exit code?) only exists once `--check` has a
        # verifier to invoke, so those tests skip themselves on the main
        # test lane, where `lake` is not installed. This is the lane
        # where their guard opens.
        # Round-robin over stable test IDs: every case belongs to exactly
        # one lane, including newly added tests. The helper suite also runs
        # here so its universal cross-module law sees a real Lean toolchain.
        #
        # The Lean-backed tests of suites that otherwise run in ci.yml (whose
        # runners have no `lake`, so there they skip) are picked out by name
        # and run here too, so each of them runs somewhere with Lean.
        run: >-
          cargo nextest run -p aver-lang
          --test proof_spec --test map_iteration_order --test yield_module_helpers_spec
          --test yield_spec --test guide_example_spec --test run_all_spec
          --test yield_verify_spec --test verify_step_budget_spec --test capability_grammar_spec
          --test proof_steps_spec --test builtin_rules_differential --test map_rules_differential --test vector_rules_differential
          --test module_bindings_spec
          -E 'binary(proof_spec) | binary(map_iteration_order) | binary(yield_module_helpers_spec)
          | (binary(yield_spec) & test(/_lean_check_builds_with_zero_errors_and_no_sorry$/))
          | (binary(guide_example_spec) & test(=the_guide_example_reaches_the_lean_wall_without_an_open_law))
          | (binary(proof_steps_spec) & (test(=lean_accepts_the_step_terms_and_refuses_mutated_ones) | test(=both_backends_close_the_same_laws_by_steps) | test(=lean_unfolds_through_local_bindings_and_refuses_a_mutation) | test(=lean_splits_a_finite_given_and_refuses_a_missing_case) | test(=lean_inducts_with_the_functional_induction_principle_and_refuses_mutations) | test(=lean_checks_ring_and_linear_steps) | test(=lean_checks_the_list_rules_and_refuses_a_mutation) | test(=lean_states_each_cited_fact_once_for_every_element_type) | test(=lean_checks_the_map_rules_over_int_string_and_record_keys) | test(=lean_takes_an_arm_of_a_nested_match_on_a_comparison) | test(=lean_states_each_cited_map_fact_once_for_every_key_and_value_type) | test(=lean_checks_the_vector_rules_and_refuses_a_mutation) | test(=lean_states_each_cited_vector_fact_once_for_every_element_type)))
          | (binary(builtin_rules_differential) & test(=the_lean_model_evaluates_every_rule_instance_to_the_same_value))
          | (binary(map_rules_differential) & test(=the_lean_model_evaluates_every_map_rule_instance_to_the_same_value))
          | (binary(vector_rules_differential) & test(=the_lean_model_evaluates_every_vector_rule_instance_to_the_same_value))
          | (binary(run_all_spec) & test(=the_programs_laws_reach_the_lean_wall))
          | (binary(yield_verify_spec) & test(=coordinator_laws_are_universal_beside_the_vm_schedule_scenarios))
          | (binary(verify_step_budget_spec) & test(=the_proof_lane_declines_a_case_verify_did_not_answer))
          | (binary(module_bindings_spec) & (test(=proof_check_proves_the_laws_over_bindings) | test(=lean_closes_the_same_laws_over_bindings_by_steps)))
          | (binary(capability_grammar_spec) & (test(=a_user_type_carrying_a_resource_handle_still_proves)
          | test(=pure_capability_is_effect_free_but_still_provider_bound_and_proof_opaque)
          | test(=resource_minting_oracle_receives_an_unconstrained_token)))'
          --partition slice:${{ matrix.shard }}/4

  proof-levels:
    # The `tactic` level of tools/steps-baseline.json: which corpus laws Lean
    # closes with tactics rather than steps. It needs Lean on every corpus file,
    # too slow for a pull request, so it runs nightly and on dispatch; the
    # `steps` level runs on every pull request in ci.yml. A law that falls from
    # steps to tactics, or a portfolio withdrawn once steps replace it, shows up
    # here as a change to the baseline. Until the tactic level is recorded
    # (`python3 tools/steps_ratchet.py --lean --update`), the script says so and
    # checks the steps level only.
    name: Proof levels ratchet (steps and tactics)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.repository == 'jasisz/aver') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Lean (via elan)
        # Keep a default for test helpers that check Lake outside a project.
        # The lake_toolchain regression separately runs the proof CLI with an
        # isolated Elan home and no default: the generated project's pin must
        # govern both availability checks and builds in that environment.
        run: |
          # `curl | sh` hides a failing curl behind a shell that succeeds on
          # empty input, so the retry below could not see it without this.
          set -o pipefail
          # elan's own download of the toolchain tarball runs its own curl
          # with no retry, so flags on the installer fetch do not cover it.
          # A transient 503 from the releases CDN therefore failed the job
          # outright; retry the whole install instead.
          for attempt in 1 2 3 4; do
            if curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
                 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                 | sh -s -- -y --default-toolchain stable; then break; fi
            if [ $attempt -eq 4 ]; then exit 1; fi
            echo "elan install failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify `lake` reachable and materialize the pinned toolchain
        # The first lake/lean invocation lazily fetches a toolchain from
        # releases.lean-lang.org; that download has no built-in retry and fails
        # on transient network blips.
        #
        # `lake --version` only warms the *default* toolchain that elan was
        # installed with. The reserved-token probe below runs Lean at the
        # version pinned for the certificate wall, and that one was still being
        # fetched lazily — from inside `cargo test`, where no retry can reach
        # it. A run died exactly there:
        #
        #   downloading .../lean-4.32.2-linux.tar.zst
        #   error: [52] Server returned nothing (Empty reply from server)
        #
        # So warm the pinned toolchain here too, under the same retry, and read
        # the version from the file that defines it rather than repeating it.
        run: |
          pinned="$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "pinned toolchain: ${pinned}"
          for attempt in 1 2 3 4 5 6; do
            if lake --version && elan toolchain install "${pinned}"; then exit 0; fi
            echo "::warning::toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::toolchain unreachable after 6 attempts"
          exit 1

      - name: Compare both levels with the baseline
        run: |
          cargo build -p aver-lang --bin aver
          python3 tools/steps_ratchet.py --lean --aver target/debug/aver --jobs 2

  proof-export:
    # Keep the existing check name: branch protection requires it by name,
    # so renaming it is a separate settings change. A failed, cancelled or
    # skipped shard must fail this aggregate even when its siblings passed.
    name: Proof Export (Lean)
    runs-on: ubuntu-latest
    needs: [proof-lanes]
    if: always() && (github.event_name != 'schedule' || github.repository == 'jasisz/aver')
    steps:
      - name: Require every proof lane
        env:
          LANES_RESULT: ${{ needs.proof-lanes.result }}
        run: |
          echo "Proof lanes: $LANES_RESULT"
          test "$LANES_RESULT" = success
