[workspace]
members = [".", "aver-lsp", "aver-rt", "aver-memory"]
exclude = ["tools/wasm-runner"]

[package]
name = "aver-lang"
version = "0.9.5"
edition = "2024"
default-run = "aver"
description = "VM and transpiler for Aver, a statically-typed language designed for AI-assisted development"
license = "MIT"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-lang"
readme = "README.md"
keywords = ["language", "interpreter", "transpiler", "programming-language"]
categories = ["compilers"]
include = [
    "/src/**",
    "/self_hosted/**",
    "!/src/bin/**",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "aver"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aver"
path = "src/main.rs"

[features]
default = ["runtime", "terminal"]
runtime = ["dep:aver-rt", "aver-memory/runtime", "dep:clap", "dep:colored", "dep:toml"]
terminal = ["aver-rt/terminal"]
wasm = ["wasm-compile", "dep:wasmtime"]
wasm-compile = ["dep:wasm-encoder"]
playground = ["wasm-compile", "dep:wasm-bindgen"]

[dependencies]
aver-memory = { path = "aver-memory", version = "=0.2.1" }
aver-rt = { path = "aver-rt", version = "=0.4.0", features = ["http", "random"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
thiserror = "1"
toml = { version = "0.8", optional = true }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-encoder = { version = "0.225", optional = true }
wasmtime = { version = "29", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "nan_value_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
