name: Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  cert-kernel:
    # One job per certification suite so the long verify suite (each test does a
    # clean-cache lake kernel build by design) no longer serializes behind the
    # fast certify/decode suites, and each suite fails independently. Shared
    # toolchain setup is duplicated per matrix leg but runs in parallel.
    name: Cert Kernel (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [cert_certify_spec, cert_verify_spec, cert_decode_spec]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Lean toolchain
        # The certification tests build every cert project from a clean lake
        # cache by design (the verifier must not trust caches); the toolchain
        # download itself is the only cacheable part.
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('tools/certkit/prelude/lean-toolchain') }}

      - name: Install Lean (via elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        # Only the decode differential suite shells out to `wasm-tools print`
        # (tools/certkit/decode_ref.py); harmless to install for the others.
        if: matrix.suite == 'cert_decode_spec'
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Verify `lake` reachable
        run: |
          for attempt in 1 2 3 4 5 6; do
            if lake --version; then exit 0; fi
            echo "::warning::lake/toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::lake unreachable after 6 attempts (toolchain download)"
          exit 1

      - name: Run certification suite
        run: cargo test -p aver-lang --features wasm --test ${{ matrix.suite }}
