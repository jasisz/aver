name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  # Nightly deep sweep against main with the heavy proptest budget: the
  # WASM lane's cross-backend differential runs 2000 cases nightly but a
  # 64-case smoke per-PR (see its `PROPTEST_CASES` below). Mirrors the
  # fuzz / proof / rust-codegen nightlies, each at its own uneven time so
  # they do not start together. Manual runs via workflow_dispatch also get
  # the full 2000-case sweep.
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:

# A newer push to the same pull request, or a newer commit on main,
# supersedes a run still in progress: only the latest one is worth a runner.
# Nightly, dispatched and release runs keep their own group and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    env:
      # The 2,000-case broad sweep belongs to nightly/manual deep CI. Pull
      # requests and pushes keep the ordinary 256-case proptest smoke.
      PROPTEST_CASES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2000' || '256' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Release tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Every feature-gated integration test runs somewhere
        # A test file (or a test in it) behind `feature = "wasm"` or
        # `feature = "wasip2"` compiles to nothing in the default-feature
        # shards, and runs only where a step names it under that feature.
        run: python3 tools/ci_test_coverage.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Package standalone certificate engine
        run: |
          cargo package -p aver-cert --all-features
          if cargo tree -p aver-cert --all-features --edges normal | grep -Eq 'aver-(lang|rt|memory)'; then
            echo "aver-cert must not depend on the compiler or runtime crates"
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude aver-lang -- -D warnings && cargo clippy -p aver-lang --lib --bin aver --benches -- -D warnings

      - name: Compile gate — aver-memory without std
        run: cargo check -p aver-memory --no-default-features

      - name: Compile gate — terminal-off feature set
        # The default build has `terminal` on, so `#[cfg(not(feature =
        # "terminal"))]` branches (the playground/wasm32 and fuzz-mutator
        # stubs) never compile in the normal gates — a whole class of
        # regression that only surfaced in the nightly Fuzz job (which
        # builds aver-lang with `terminal` off). The Int=ℤ migration hit
        # exactly this: a `Value::Int(<raw i64>)` in the terminal-off
        # `Terminal.Size` stub broke 7/8 fuzz targets while every PR
        # stayed green. Checking the fuzz mutator manifest reproduces the
        # exact terminal-off feature resolution (aver-lang with
        # `default-features = false, features = ["runtime"]`) in ~17s, so
        # this class now gates on PRs instead of the morning after.
        run: cargo check --manifest-path fuzz/mutator/Cargo.toml

      - name: Compile gate — isolated certificate feature sets
        # The certificate-producer split leaves feature combinations that no
        # test step compiles on its own: the slim aver-cert plan surface
        # (what non-certify compiler builds link), the actual wasm32 playground
        # library (the aver_self_host_cli bin has never built under playground
        # features, a pre-existing gap outside this gate's scope), and a bare
        # `certify` build. Cheap `cargo check`s keep every nameable combination
        # compiling without adding test time. The remaining combination,
        # wasip2-only, is checked in the WASM checks lane, whose cache holds the
        # heavy component-model dependencies.
        run: |
          cargo check -p aver-cert --no-default-features --features plans
          cargo check -p aver-lang --lib --target wasm32-unknown-unknown --no-default-features --features playground
          cargo check -p aver-lang --features certify

      - name: Check shipped examples
        # Gate the shipped example corpus: a merge that breaks an
        # example under `aver check` must fail CI, not ship silently.
        # The preceding check/clippy gates have already compiled most of the
        # graph; this step links the debug CLI if needed. Only `examples/core`
        # and `examples/data` are gated — `examples/diagnostics` contains
        # deliberately broken files (lint/error demos) and stays ungated. Bare
        # exit codes: each command's status fails the step directly, no pipes.
        run: |
          cargo run --bin aver -- check examples/core
          cargo run --bin aver -- check examples/data

      # The unit, doc and workspace-crate tests take two minutes or less each.
      # As jobs of their own they each paid a runner, a checkout and a cache
      # restore, and held two of the twenty runners the repository shares;
      # here they reuse the build the gates above just made.
      - name: aver-lang unit and docs
        run: cargo test -p aver-lang --lib --bins && cargo test -p aver-lang --doc

      - name: Workspace crates
        # The workspace test builds aver-cert with its default `verify`
        # feature only; the producer's unit tests need `engine` as well.
        run: cargo test --workspace --exclude aver-lang && cargo test -p aver-cert --lib --all-features

  proof_steps:
    name: Proof-step coverage ratchet
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Optimise the build
        # This ratchet executes the proof kernel written in Aver. It took
        # nearly sixteen minutes with the WASM lane's unoptimised CLI, after
        # that lane's other checks. Build only the default-feature CLI here,
        # with the same optimisation and cache key as the native shards.
        run: printf '\n[profile.dev]\nopt-level = 1\n' >> .cargo/config.toml

      - uses: Swatinem/rust-cache@v2

      - name: Check every steps-level law
        # Keep the complete corpus and the committed baseline. Lean checks
        # every steps-level gain separately in proof.yml; the nightly run
        # also checks the tactic level.
        run: |
          cargo build -p aver-lang --bin aver
          python3 tools/steps_ratchet.py --aver target/debug/aver

  native_tests:
    name: Native tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integrations 1/4
            command: python3 tools/ci_test_shard.py 0 4
          - name: integrations 2/4
            command: python3 tools/ci_test_shard.py 1 4
          - name: integrations 3/4
            command: python3 tools/ci_test_shard.py 2 4
          - name: integrations 4/4
            command: python3 tools/ci_test_shard.py 3 4
    env:
      # The 2,000-case broad sweep belongs to nightly/manual deep CI. Pull
      # requests and pushes keep the ordinary 256-case proptest smoke while
      # deterministic tests and every integration target still run each time.
      PROPTEST_CASES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2000' || '256' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Optimise the build
        # Most of these tests run the `aver` binary, and the slowest ones run
        # the proof kernel written in Aver inside it: unoptimised, one suite
        # took over ten minutes. `opt-level = 1` for the whole graph, in CI
        # only: the developer `dev` profile in Cargo.toml stays as it is. The
        # setting goes into this checkout's Cargo config, not the environment
        # or the Cargo home, because the tests that build generated projects
        # run Cargo in temporary directories, and those builds would pay for
        # optimising their own dependencies. Written before the cache step,
        # whose key hashes this file, so optimised dependencies are cached
        # apart from unoptimised ones.
        run: printf '\n[profile.dev]\nopt-level = 1\n' >> .cargo/config.toml

      - uses: Swatinem/rust-cache@v2

      - name: Prefetch provider-host feature graph
        # Some integration tests build generated provider hosts with Cargo
        # offline, so every shard fetches the exact locked graph first.
        run: cargo fetch --locked

      - name: Test shard
        run: ${{ matrix.command }}

  windows_runtime:
    # The runtime crate carries platform arms no Linux job can reach.
    # `Disk.sync` is the first one whose behaviour differs rather than
    # its implementation: Windows has no call that flushes a directory,
    # so the operation answers Ok there without a handle. That arm and
    # its tests are `#[cfg(windows)]`, so they only ever compile here.
    # `aver-rt` alone, with no features: the wasm/wasip2 surface is
    # Linux-only in this workflow and nothing in it is Windows-specific.
    name: Runtime crate (windows)
    runs-on: windows-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test aver-rt
        run: cargo test -p aver-rt

      # The nodes of user values and of the runtime's collections are
      # reference counted by hand-written unsafe code; Miri checks it for
      # undefined behaviour and data races. Only those modules and the list
      # tests that take nodes apart: the rest of the crate's tests take most
      # of an hour under Miri.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri on the reference-counted nodes
        run: cargo +nightly miri test -p aver-rt --lib -- shared::tests shared_eq::tests thin::tests tests::list_node tests::owned_prepend_and_uncons tests::uncons_reuse_builds

  wasm_lanes:
    name: WASM (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    # The Wasmtime deployment pack test, 14 to 17 minutes of cold release-host
    # builds, runs in cert.yml as part of the ready-to-merge set (job `pack`).
    strategy:
      fail-fast: false
      matrix:
        lane: [checks, wasm-gc]
    timeout-minutes: 45
    env:
      # The wasm/wasip2 feature set pulls in wasmtime + component-model
      # crates and several large integration-test binaries. Keep each lane's
      # artifact footprint bounded on GitHub's small runners; debug symbols
      # are not useful for the CI pass/fail signal here, and lower parallelism
      # avoids multiple large links peaking at once.
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Each lane warms its own feature graph without racing the other
          # lanes to save a cache containing a different subset of artifacts.
          key: wasm-${{ matrix.lane }}

      - name: Cache binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: ~/.local/binaryen
          key: binaryen-${{ runner.os }}-version_129

      - name: Install WASM tools
        # A pinned release does not change between runs, so the download only
        # has to happen on a cache miss. Retrying alone was not enough: one run
        # spent all six attempts against a releases CDN that was down for
        # longer than the retry window.
        env:
          BINARYEN_VERSION: version_129
        run: |
          if [ ! -x "$HOME/.local/binaryen/bin/wasm-opt" ]; then
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
              "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o binaryen.tar.gz
            tar -xzf binaryen.tar.gz
            mkdir -p "$HOME/.local"
            rm -rf "$HOME/.local/binaryen"
            mv "binaryen-${BINARYEN_VERSION}" "$HOME/.local/binaryen"
          fi
          echo "$HOME/.local/binaryen/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/binaryen/bin/wasm-merge"
          test -x "$HOME/.local/binaryen/bin/wasm-opt"
          test -x "$HOME/.local/binaryen/bin/wasm-metadce"

      - name: Prefetch provider-host feature graph
        # Pack and provider tests build generated hosts with Cargo offline.
        # A lane must not rely on earlier suites having fetched extra crates.
        run: cargo fetch --locked

      - name: Clippy (wasm + wasip2)
        if: matrix.lane == 'checks'
        run: cargo clippy -p aver-lang --lib --bin aver --benches --features wasm,wasip2 -- -D warnings

      - name: Compile gate — wasip2 without wasm
        if: matrix.lane == 'checks'
        # Every other step here builds `wasm` or `wasm,wasip2`; a wasip2-only
        # binary (component output, no certificate engine, no wasm-gc CLI
        # target) is a combination users can name and must keep compiling.
        # Check-only — this job's cache already carries the component-model
        # dependency graph.
        run: cargo check -p aver-lang --features wasip2

      - name: Compile fuzz harnesses
        if: matrix.lane == 'checks'
        # The standalone fuzz crate is outside the workspace, so ordinary
        # compiler checks miss harness/API drift. Type-check every harness
        # against the cached WASM graph without starting an AFL campaign.
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --target-dir target

      - name: Unit tests (wasm + wasip2)
        if: matrix.lane == 'checks'
        run: cargo test -p aver-lang --lib --features wasm,wasip2

      - name: Capability provider target canaries
        if: matrix.lane == 'checks'
        run: cargo test -p aver-lang --features wasm,wasip2 --test provider_spec --test capability_grammar_spec --test capability_target_manifest_spec

      - name: Certificate coupling ratchet
        if: matrix.lane == 'checks'
        # An emitter or MIR change that makes a certified function decline must
        # fail the PR that makes it, not the next Lean run. `--certify` writes
        # the package without building it, so this needs no Lean: it compiles
        # the certificate corpus and compares the certified exports, bridges
        # and law-claims per program with tools/cert-baseline.json. The baseline
        # holds the `--examples` run (every export bridged); the default
        # law-cone run must cite the same bridges from every law-claim. A gain is
        # recorded in the same commit with `python3 tools/cert_ratchet.py
        # --update`. The binary is the one the canaries above just linked.
        timeout-minutes: 10
        run: |
          cargo build -p aver-lang --bin aver --features wasm,wasip2
          python3 tools/cert_ratchet.py --aver target/debug/aver

      - name: Install Node for the JavaScript Work host
        if: matrix.lane == 'wasm-gc'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test wasm-gc suites
        if: matrix.lane == 'wasm-gc'
        # Compilation has stalled for hours after `Compiling aver-lang`
        # (jasisz/aver#1339); retain the bounded step after splitting lanes.
        timeout-minutes: 35
        # Run the wasm-gc integration surface explicitly under `wasm`, not
        # the whole package under `wasm,wasip2`. The old package-wide command
        # also built unrelated integration tests and bins with the full
        # component-model dependency graph, which was enough to exhaust the
        # hosted runner during link. This list is the feature-gated wasm
        # corpus plus the ordinary regression files that contain an extra
        # wasm-gc test behind `#[cfg(feature = "wasm")]`.
        #
        # Proptest budget — split per-PR vs nightly. The wasm-feature
        # proptests include the cross-backend DIFFERENTIAL sweeps
        # (`tests/cross_backend_proptest.rs`), which spawn `aver run` twice
        # per case (VM + wasm-gc) and JIT each module in wasmtime —
        # ~0.5-1.5s/case, vs microseconds for the in-process proptests in
        # the Check & Test job. At 2000 cases that is ~30 min, too slow for
        # every PR. So: a 64-case SMOKE per-PR, and the full 2000-case
        # sweep NIGHTLY (and on workflow_dispatch). The deterministic
        # differentials (sign matrices, the Euclidean law, canonical-eq,
        # interpolation render) run at ANY case count, so they stay the
        # real per-PR net; the 2000-case sweep is the broad randomized
        # net, alongside the fuzz nightly's `fuzz_parity_vm_vs_wasm_gc`
        # in-process differential.
        env:
          PROPTEST_CASES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2000' || '64' }}
        run: |
          set -euo pipefail
          cargo build -p aver-cert --bin aver-cert
          for test in \
            bigint_literals_differential \
            builtin_rules_differential \
            map_rules_differential \
            vector_rules_differential \
            pick_rules_differential \
            cert_certify_spec \
            cert_decode_spec \
            cert_one_build_spec \
            cert_verify_spec \
            cross_backend_proptest \
            cross_backend_stress \
            empty_literal_operands_spec \
            guide_example_spec \
            knowledge_provider_spec \
            module_bindings_spec \
            shadowing_ban \
            verify_runner_regressions \
            vm_self_qualified_type \
            wasm_gc_capture_output \
            wasm_gc_carrier_i64_differential \
            wasm_gc_carrier_keys_differential \
            wasm_gc_codegen_regression \
            wasm_gc_container_read_ownership \
            wasm_gc_differential_mir \
            wasm_gc_plan_mir_equivalence \
            wasm_gc_effect_arg_overflow_regression \
            wasm_gc_games_differential_mir \
            wasm_gc_handler_carrier \
            wasm_gc_int_tree_differential \
            wasm_gc_twins_differential \
            wasm_gc_record_views \
            wasm_gc_map_versions_spec \
            wasm_gc_match_shapes_regression \
            wasm_gc_no_trap_stubs \
            wasm_gc_vector_versions_spec \
            wasm_gc_optimize_trunc_sat \
            wasm_gc_packed_sequence \
            wasm_gc_perslot_int_unboxing_differential \
            wasm_gc_private_record_field_regression \
            wasm_gc_record_replay_spec \
            wasm_gc_spec \
            wasm_gc_string_scalar_semantics_regression \
            wasm_gc_tuple_variant_match_regression \
            wasm_gc_call_result_types_regression \
            wasm_gc_unicode_case_regression \
            wasm_gc_unicode_trim_regression \
            wasm_gc_verify_bool_case_regression \
            wasm_gc_verify_nested_values \
            wasm_gc_verify_option_case_regression \
            wasm_gc_verify_result_record_eq_regression \
            wasm_work_spec \
            wasm_host_work_spec \
            work_shape_spec \
            yield_spec \
            yield_request_traces_spec \
            yield_imported_effects_spec \
            process_stop_requested_spec \
            tcp_nonblocking_spec \
            regression_vm_verify_module_bindings \
            yield_module_helpers_spec
          do
            cargo test -p aver-lang --features wasm --test "$test"
          done
          # One wasm-gated test in a suite whose other cases run in the
          # default-feature shards, several over twelve-thousand-case domains;
          # run only the gated one here.
          cargo test -p aver-lang --features wasm --test verify_step_budget_spec -- \
            the_vm_and_wasm_gc_lanes_agree_about_which_cases_are_runnable --exact

      - name: Test wasip2 suites
        if: matrix.lane == 'checks'
        # `wasip2` is a separate feature; `wasm` alone leaves every
        # `#![cfg(feature = "wasip2")]` test file at 0 tests. Keep these
        # component-model suites in their own loop so only wasip2 tests pay
        # for the heavier wasmtime-wasi dependency graph. They run in the
        # checks lane, which already builds aver-lang with `wasm,wasip2`; a
        # lane of their own rebuilt the same graph for four minutes of tests
        # and took one more of the twenty runners. A suite whose tests
        # are gated on both `wasm` and `wasip2` runs here, where both are on;
        # tools/ci_test_coverage.py fails the build when a gated suite is in
        # neither loop.
        run: |
          set -euo pipefail
          for test in \
            stdlib_spec \
            main_exit_status_spec \
            wasip2_codegen_regression \
            wasip2_coordinator_spec \
            wasip2_http \
            wasip2_http_handler \
            wasip2_http_handler_stress \
            wasip2_poc \
            wasip2_stress \
            wasip2_tcp \
            wasip2_tcp_stress \
            wasip2_unicode_case \
            wasm_work_spec \
            knowledge_provider_spec \
            work_shape_spec \
            yield_spec \
            capability_wit_spec \
            compile_spec \
            nested_patterns_spec \
            bare_variant_patterns_spec \
            yield_verify_spec
          do
            cargo test -p aver-lang --features wasm,wasip2 --test "$test"
          done

  wasm:
    # Preserve the required "WASM" check and the release dependency. An
    # aggregate must reject failed, cancelled or skipped lanes, not silently
    # go green because its successful siblings completed.
    name: WASM
    runs-on: ubuntu-latest
    needs: [wasm_lanes]
    if: always() && (github.event_name != 'schedule' || github.repository == 'jasisz/aver')
    steps:
      - name: Require every WASM lane
        env:
          LANES_RESULT: ${{ needs.wasm_lanes.result }}
        run: |
          echo "WASM lanes: $LANES_RESULT"
          test "$LANES_RESULT" = success

  wasm_release_build:
    # Post-merge release-build verification under `--features wasm`.
    # PR-time CI runs `cargo test --features wasm` (debug profile) in
    # the `wasm_lanes` matrix above — that catches every logic regression. The
    # release build only matters when the artifact actually ships
    # (post-merge to `main`), and dragging it onto PR-time CI added
    # 3–5 min of wait without ever surfacing a release-only bug in
    # practice. If a release-mode regression slips in, a hot follow-up
    # PR fixes it from main; PR review unblocks immediately.
    name: WASM release build (main)
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    needs: [check, wasm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache wasm-tools
        id: cache-wasm-tools-release
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-1.246.2
      - name: Install wasm-tools
        if: steps.cache-wasm-tools-release.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools "$HOME/.local/bin/wasm-tools"
      - name: Build (wasm release)
        run: cargo build -p aver-lang --features wasm --release
      - name: Validate the exact release-candidate edge artifact
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          mkdir -p target/release-edge-smoke
          ./target/release/aver compile tools/edge/app.av \
            --preset cloudflare \
            --handler handler \
            --module-root tools/edge \
            -o target/release-edge-smoke
          "$HOME/.local/bin/wasm-tools" validate --features all \
            target/release-edge-smoke/app.wasm

  bench:
    # Post-merge bench gate. PR-time CI doesn't run this — perf
    # regressions get caught when they hit `main`, then a follow-up
    # PR reverts or fixes them. Trade chosen deliberately: PR review
    # unblocks 3–5 min faster, and the fix-forward latency for a perf
    # regression on a pre-1.0 compiler is acceptable. Locally,
    # contributors can still run `aver bench bench/scenarios/
    # --target=vm` against their branch before opening a PR if they
    # touched a perf-sensitive path.
    name: Bench Gate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aver (release)
        run: cargo build --release --bin aver

      - name: Run bench scenarios
        # `--baseline-dir bench/baselines/` auto-picks the file matching
        # this runner's host (`<os>-<arch>-vm.json`). When no matching
        # baseline exists, the bench run still produces reports but the
        # gate is silently skipped — first run on a new host won't fail
        # the build, just won't gate. To pin a Linux baseline, run
        # `aver bench bench/scenarios/ --target=vm --json --save-baseline
        # bench/baselines/linux-x86_64-vm.json` on this runner and
        # commit the result.
        run: |
          ./target/release/aver bench bench/scenarios/ \
            --target=vm \
            --baseline-dir bench/baselines/ \
            --fail-on-regression \
            --json | tee bench-results.ndjson

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-results
          path: bench-results.ndjson
          retention-days: 30
