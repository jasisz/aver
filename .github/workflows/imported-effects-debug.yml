name: Imported effects diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  observe:
    if: github.head_ref == 'feat/yield-imported-effects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl -sSfL --retry 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --bin aver
      - name: Observe and prove imported effects
        run: |
          target/debug/aver verify tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects
          target/debug/aver proof tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects --backend lean --check --sorry-budget 0 -o /tmp/imported-effects-proof
      - name: Inspect an unfinished splice tactic
        if: failure()
        run: |
          cd /tmp/imported-effects-proof
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Looper.lean')
          text = path.read_text()
          import subprocess
          prefix = text.split('-- verify law ')[0]
          statement = next(line for line in text.splitlines() if line.startswith('theorem __aver_reason_') and 'Splice__runInLoopAt1Observed_law_splice_implication :' in line)
          stem = 'Looper.__runTrace4c6f6f706572'
          small = 'Looper.__runInLoopAt1, Looper.__runJoin1'
          completed = f'{stem}Drive.eq_1, {stem}DriveLoop.eq_1'
          full = f'{small}, {stem}Splice__runInLoopAt1, {completed}'
          begin = f'intro outcome inputs position events consumed; simp only [beq_iff_eq, {stem}Splice__runInLoopAt1Observed, {stem}Splice__runInLoopAt1Drive]; fun_induction {stem}DriveLoop outcome inputs position events consumed; all_goals (try (conv => rhs; rw [{stem}Drive.eq_def])); '
          probes = [
              f"all_goals (repeat' first | assumption | rfl | (split at *) | (simp_all [{full}])); all_goals trace_state; all_goals sorry",
              f"all_goals (repeat' first | assumption | rfl | (solve | simp_all only [{small}, {completed}]) | (split at *)); all_goals (try simp_all [{full}]); all_goals trace_state; all_goals sorry",
              f"all_goals (try (rename_i ih; rw [ih])); all_goals (try (conv => rhs; simp only [{small}])); all_goals (try (congr 1)); all_goals (repeat' first | rfl | (simp_all only [{full}]) | (split at *)); all_goals trace_state; all_goals sorry",
          ]
          for i, tactic in enumerate(probes):
              name = f'LooperProbe{i}.lean'
              Path(name).write_text(prefix + statement + '\n  ' + begin + tactic + '\nend Looper\n')
              print(f'PROBE {i}', flush=True)
              result = subprocess.run(['lake', 'env', 'lean', name], timeout=90)
              print(f'PROBE {i} EXIT {result.returncode}', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-effects-proof
          path: |
            /tmp/imported-effects-proof/**/*.lean
            /tmp/imported-effects-proof/*.json
            /tmp/imported-effects-proof/lean-toolchain
