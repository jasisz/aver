name: Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  cert-kernel:
    # One job per certification suite, and the long verify suite is further
    # sharded across four runners (tests are independent; each spawns its own
    # kernel build), so wall-clock is bounded by the slowest single test rather
    # than the whole suite. Shared toolchain setup is duplicated per matrix leg
    # but runs in parallel.
    name: Cert Kernel (${{ matrix.suite }}${{ matrix.partition && format(' {0}', matrix.partition) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cert_certify_spec
          - suite: cert_decode_spec
          - suite: cert_whole_module_guard_iso
          - suite: cert_verify_spec
            partition: 1/4
          - suite: cert_verify_spec
            partition: 2/4
          - suite: cert_verify_spec
            partition: 3/4
          - suite: cert_verify_spec
            partition: 4/4
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Lean toolchain
        # The verifier's production default remains a clean Lake build. Tests
        # may copy an exact-byte-keyed pristine prelude cache into fresh builds;
        # the Lean toolchain download is cached separately here.
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('tools/certkit/prelude/lean-toolchain') }}

      - name: Install Lean (via elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        # Only the decode differential suite shells out to `wasm-tools print`
        # (tools/certkit/decode_ref.py); harmless to install for the others.
        if: matrix.suite == 'cert_decode_spec'
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Verify `lake` reachable
        run: |
          for attempt in 1 2 3 4 5 6; do
            if lake --version; then exit 0; fi
            echo "::warning::lake/toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::lake unreachable after 6 attempts (toolchain download)"
          exit 1

      - name: Cache prebuilt prelude store
        # The test harness's exact-byte-keyed pristine prelude store: a stale
        # or mismatching entry is a harmless miss (the key is a content hash of
        # the staged audited bytes), so caching across runs only saves the
        # per-job pristine build.
        uses: actions/cache@v4
        with:
          path: /tmp/aver-cert-prelude-store
          key: prelude-store-${{ runner.os }}-${{ hashFiles('src/codegen/cert/*.lean', 'tools/certkit/prelude/**', 'src/main/cert_cmd.rs') }}

      - name: Install nextest
        if: matrix.partition != ''
        uses: taiki-e/install-action@nextest

      - name: Run certification suite
        if: matrix.partition == ''
        run: cargo test -p aver-lang --features wasm --test ${{ matrix.suite }}

      - name: Run certification suite shard
        # The verify tests are independent (each builds its own temp cert
        # project), so count-partitioning across runners is safe; every test
        # runs in exactly one shard.
        if: matrix.partition != ''
        run: cargo nextest run -p aver-lang --features wasm --test ${{ matrix.suite }} --partition count:${{ matrix.partition }}
