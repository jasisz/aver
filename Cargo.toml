[workspace]
members = [".", "aver-lsp", "aver-rt"]

[package]
name = "aver-lang"
version = "0.3.0"
edition = "2024"
default-run = "aver"
description = "Interpreter and transpiler for Aver, a statically-typed language designed for AI-assisted development"
license = "MIT"
repository = "https://github.com/jasisz/aver"
keywords = ["language", "interpreter", "transpiler", "programming-language"]
categories = ["compilers"]

[lib]
name = "aver"

[[bin]]
name = "aver"
path = "src/main.rs"

[dependencies]
aver-rt = { path = "aver-rt", version = "=0.1.0", features = ["http"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
thiserror = "1"
toml = "0.8"
url = "2"
