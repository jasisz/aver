[package]
name = "aver-rt"
version = "0.4.11-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared Rust runtime pieces for Aver-generated programs"
readme = "README.md"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-rt"
keywords = ["aver", "runtime", "transpiler", "language", "codegen"]
categories = ["compilers"]

[lib]
name = "aver_rt"
path = "src/lib.rs"

[features]
default = []
http = ["dep:ureq"]
random = ["dep:rand"]
terminal = ["dep:crossterm"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
crossterm = { version = "0.28", optional = true }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = { version = "0.9", optional = true }
sha2 = "0.10"
ureq = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(all(not(unix), not(target_family = "wasm")))'.dependencies]
ctrlc = "3.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
polling = "3.11"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "list_concat"
harness = false

# On wasm32-unknown-unknown:
# - `rand` pulls in `getrandom`, which needs the `js` feature to use
#   the browser's crypto API. Configuring getrandom here (not behind
#   our own feature) keeps `random` usable on any target.
# - `std::time::SystemTime::now()` panics ("time not implemented on
#   this platform"). We route `time_now` / `time_unix_ms` through
#   `js_sys::Date` so the playground returns real wall-clock values
#   instead of "unreachable executed".
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
