[providers]
schema = 1

[[providers.bindings]]
capability = "Pool"
answer = "Pooled"

# Two job kinds under one generated loop, sharing one table and one limit.
# Each seam is three ends: the task to start, the consumption of a task whose
# job began, and the state update a finished job lands.
[[providers.bindings]]
capability = "Alpha"
work = "Pooled.scoreAlpha"
task = "Pooled.alphaTask"
started = "Pooled.alphaStarted"
landed = "Pooled.alphaLanded"

[[providers.bindings]]
capability = "Beta"
work = "Pooled.scoreBeta"
task = "Pooled.betaTask"
started = "Pooled.betaStarted"
landed = "Pooled.betaLanded"

[work]
max-jobs = 3

[run]
order = "Node.order"
admit = "Node.admit"
stop = "Node.stop"
view = "Node.View"
