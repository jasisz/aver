name: Imported effects diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  observe:
    if: github.head_ref == 'feat/yield-imported-effects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl -sSfL --retry 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --bin aver
      - name: Observe and prove imported effects
        run: |
          target/debug/aver verify tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects
          target/debug/aver proof tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects --backend lean --check --sorry-budget 0 -o /tmp/imported-effects-proof
      - name: Inspect imported transport and cursor goals
        if: failure()
        run: |
          cd /tmp/imported-effects-proof
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('Wrapper.lean').read_text()
          lines = text.splitlines()
          index = next(i for i, line in enumerate(lines) if line.startswith('  | (') and 'with | h inputs __aver_transport_ih' in line)
          tactic = lines[index][4:].replace('; done))', '; all_goals trace_state; all_goals sorry))')
          for variant in ['steps', 'finish']:
              probe = tactic
              if variant == 'steps':
                  probe = probe.split('; all_goals (simp_all +zetaDelta [Looper.')[0] + '; all_goals trace_state; all_goals sorry))'
              name = f'WrapperTransport{variant}.lean'
              Path(name).write_text('\n'.join(lines[:index-1]) + '\n  ' + probe + '\nend Wrapper\n')
              print(f'PROBE {variant}', flush=True)
              result = subprocess.run(['lake', 'env', 'lean', name], timeout=90)
              print(f'PROBE {variant} EXIT {result.returncode}', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-effects-proof
          path: |
            /tmp/imported-effects-proof/**/*.lean
            /tmp/imported-effects-proof/*.json
            /tmp/imported-effects-proof/lean-toolchain
