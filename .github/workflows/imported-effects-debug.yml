name: Imported effects diagnostics
on:
  push:
    branches: [feat/yield-imported-effects]
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl -sSfL --retry 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --bin aver
      - name: Observe and prove imported effects
        run: |
          target/debug/aver verify tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects
          set -o pipefail
          target/debug/aver proof tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects --backend lean --check --sorry-budget 0 -o /tmp/imported-effects-proof 2>&1 | tee /tmp/imported-effects-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-effects-base
          path: |
            /tmp/imported-effects-proof.log
            /tmp/imported-effects-proof/**/*.lean
            /tmp/imported-effects-proof/*.json
      - name: Inspect imported entry and splice goals
        if: failure()
        run: |
          cd /tmp/imported-effects-proof
          python3 - <<'PYPROBE'
          from pathlib import Path
          import re
          import subprocess
          import os, signal
          text = Path('ImportedEffects.lean').read_text().replace('namespace ImportedEffects', 'set_option linter.unusedSimpArgs false\nnamespace ImportedEffects', 1)
          lines = text.splitlines()
          definitions = text.split('-- verify law ')[0]
          from concurrent.futures import ThreadPoolExecutor
          executor = ThreadPoolExecutor(max_workers=2)
          futures = []
          def probe(name, source):
              futures.append(executor.submit(run_probe, name, source))
          def run_probe(name, source):
              Path(name + '.lean').write_text(source)
              process = subprocess.Popen(['lake', 'env', 'lean', name + '.lean'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, start_new_session=True)
              try:
                  output, _ = process.communicate(timeout=90)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  output, _ = process.communicate()
                  output += '\nProbe timed out after 90 seconds\n'
              Path(name + '.lean.log').write_text(output)
              print(name, 'EXIT', process.returncode, flush=True)
              print('\n'.join(line for line in output.splitlines() if 'error:' in line or line.startswith('case ')), flush=True)
          def goal_only(tactic, count=-1):
              tactic = tactic.replace('simp_all +zetaDelta', 'simp +zetaDelta', count)
              # Local exclusions are only accepted by simp_all / simp [*].
              return re.sub(r'(simp \+zetaDelta(?: only)? \[)([^]]*)\]', lambda match: match[1] + ', '.join(arg for arg in match[2].split(', ') if not arg.startswith('-_')) + ']', tactic)
          mapping_defs = definitions + ''.join('-- verify law ' + block for block in text.split('-- verify law ')[1:] if block.startswith('__repeatedTrace') and ('Events.append ' in block.splitlines()[0] or 'Events.singleton ' in block.splitlines()[0]))
          index = next(i for i,line in enumerate(lines) if line.startswith('theorem __aver_reason_') and 'Direct_law_mapping_implication :' in line and 'repeated' in line)
          first = next(i for i in range(index,len(lines)) if lines[i] == '  first')
          mapping_prefix = mapping_defs + '\n'.join(lines[index:first]) + '\n  '
          mapping_tactic = lines[first+1].strip()[2:]
          probe('Mapping', mapping_prefix + mapping_tactic + '\nend ImportedEffects\n')
          probe('MappingSteps', mapping_prefix + re.sub(r'grind \[[^]]*\]', 'trace_state; sorry', mapping_tactic) + '\nend ImportedEffects\n')
          no_ih_simp = mapping_tactic.replace('simp_all +zetaDelta [', 'simp +zetaDelta [*, -_aver_transport_ih, ')
          split_context = goal_only(mapping_tactic, 1).replace('| split)', '| split at *)')
          mapped_inputs = re.search(r'ImportedEffects\.\w+Inputs', mapping_tactic).group()
          right_fold = re.search(r'rw \[([^] ]+\.eq_def)\]', mapping_tactic[mapping_tactic.index('rw [') + 4:]).group(1)
          current_bound = 'have _aver_boundary := _fact0 outcome (' + mapped_inputs + ' inputs) position childEvents consumed; rw [' + right_fold + '] at _aver_boundary; '
          bounded = mapping_tactic.replace('cases inputs;', current_bound + 'cases inputs;', 1)
          bounded = goal_only(bounded, 1).replace('| split)', '| split at *)')
          for name, suffix in [('Cursor', '__repeatedTrace496d706f7274656445666665637473Cursor_law_boundedSuffix_implication :')]:
              index = next(i for i,line in enumerate(lines) if line.startswith('theorem __aver_reason_') and suffix in line)
              first = next(i for i in range(index,len(lines)) if lines[i] == '  first')
              if name == 'Cursor':
                  tactic = next(line.strip()[2:] for line in lines[first:] if line.strip().startswith('| (') and 'fun_induction' in line)
              else:
                  tactic = lines[first+1].strip()[2:]
              prefix = definitions + '\n'.join(lines[index:first]) + '\n  '
              if name == 'Cursor':
                  finite_names = sorted(set(re.findall(r'\b(?:ImportedEffects|Wrapper|Looper)\.__\w*(?:SourceSegment|Source__)\w+', tactic)))
                  opening, rest = tactic.split("repeat' first | (simp_all +zetaDelta only [", 1)
                  finite_definitions, rest = rest.split(']', 1)
                  finite_definitions = ', '.join(name for name in finite_definitions.split(', ') if name not in finite_names)
                  branches = ''.join(' | (fun_cases ' + name + ')' for name in finite_names)
                  finite_tactic = opening + "repeat' first" + branches + " | (simp_all +zetaDelta only [" + finite_definitions + ']' + rest
              if name == 'Cursor':
                  steps = tactic.split('; all_goals grind [')[0]
                  opening = tactic.split("all_goals (repeat' first", 1)[0]
                  finite = re.search(r'simp_all \+zetaDelta only \[([^]]*)\]', tactic).group(1)
                  equations = ', '.join('= ' + name + '.eq_def' for name in finite.split(', ') if name.startswith(('ImportedEffects.', 'Wrapper.', 'Looper.')))
                  probe('CursorGrind', prefix + opening + 'all_goals grind [' + equations + ', List.drop_cons, List.drop_drop, List.length_drop]; done)\nend ImportedEffects\n')
                  # Case-split actual finite observers, not record-only adapter
                  # wrappers whose one-case eliminators can repeat unchanged.
                  adapters = [name for name in finite_names if 'SourceSegment' in name]
                  observers = [name for name in finite_names if 'Source__' in name]
                  branches = ''.join(' | (fun_cases ' + name + ')' for name in observers)
                  body = "all_goals (repeat' first" + branches + " | (simp_all +zetaDelta only [" + ', '.join(adapters) + "]) | split at *); all_goals grind [" + equations + ", List.drop_cons, List.drop_drop, List.length_drop]; done)"
                  probe('CursorObservers', prefix + opening + body + '\nend ImportedEffects\n')
          index = next(i for i,line in enumerate(lines) if line.startswith('theorem __aver_reason_') and 'Splice__repeatedInRunAt1Observed_law_splice_implication :' in line)
          first = next(i for i in range(index,len(lines)) if lines[i] == '  first')
          tactic = lines[first+1].strip()[2:]
          primary = tactic.rsplit(' | (simp only [beq_iff_eq', 1)[0] + ')'
          prefix = definitions + '\n'.join(lines[index:first]) + '\n  '
          probe('Splice', prefix + primary + '\nend ImportedEffects\n')
          # Check composition against the exact cited theorem types even while
          # an earlier independent mapping obligation remains open.
          index = next(i for i,line in enumerate(lines) if line.startswith('theorem __aver_reason_') and '__repeatedSourceTraceFrom_law_correspondence_implication :' in line)
          first = next(i for i in range(index,len(lines)) if lines[i] == '  first')
          header = lines[index:first]
          binders = []
          body = []
          for line in header[1:]:
              match = re.fullmatch(r'  have (_fact\d+) := (\S+)', line)
              if match:
                  local, cited = match.groups()
                  cited = cited.removeprefix('ImportedEffects.')
                  theorem = re.search(r'theorem ' + re.escape(cited) + r'\s*:(.*?) := by', text, re.S)
                  if theorem:
                      binders.append('(' + local + ' : ' + theorem.group(1).strip() + ')')
                      continue
              body.append(line)
          declaration = header[0].replace(' :', ' ' + ' '.join(binders) + ' :', 1)
          prefix = definitions + declaration + '\n' + '\n'.join(body) + '\n  '
          tactic = lines[first+1].strip()[2:]
          probe('RepeatedComposition', prefix + tactic + '\nend ImportedEffects\n')
          normalized = tactic[tactic.index('(simp only [Bool.and_eq_true'):].split('; first', 1)[0]
          probe('RepeatedNormalized', prefix + normalized + '; all_goals trace_state; all_goals sorry)\nend ImportedEffects\n')
          for future in futures:
              future.result()
          executor.shutdown()
          PYPROBE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-effects-proof
          path: |
            /tmp/imported-effects-proof.log
            /tmp/imported-effects-proof/**/*.lean
            /tmp/imported-effects-proof/*.json
            /tmp/imported-effects-proof/*.log
            /tmp/imported-effects-proof/lean-toolchain
      - name: Check existing recursive compositions
        if: always()
        run: |
          for fixture in yield_recursive_traces yield_recursive_imports yield_request_traces; do
            target/debug/aver proof tests/fixtures/$fixture/main.av --module-root tests/fixtures/$fixture --backend lean --check --sorry-budget 0 -o /tmp/$fixture > /tmp/$fixture.log 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursive-compositions-proof
          path: |
            /tmp/yield_recursive_traces/*.lean
            /tmp/yield_recursive_traces/*.log
            /tmp/yield_recursive_traces.log
            /tmp/yield_recursive_imports/*.lean
            /tmp/yield_recursive_imports/*.log
            /tmp/yield_recursive_imports.log
            /tmp/yield_request_traces/*.lean
            /tmp/yield_request_traces.log
