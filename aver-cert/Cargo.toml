[package]
name = "aver-cert"
version = "0.1.4"
edition = "2024"
description = "Independent artifact certificate engine and verifier for Aver WebAssembly"
license = "MIT"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-cert"
readme = "README.md"
keywords = ["aver", "lean", "verification", "webassembly"]
categories = ["development-tools", "wasm"]
include = [
    "/src/**",
    "/assets/wall/**/*.lean",
    "/assets/wall/**/lean-toolchain",
    "/LICENSE",
    "/README.md",
]

[features]
default = ["verify"]
# Plan surface only: the fragment/sym plan IR types plus the canonical byte
# lowering the wasm-gc emitter consumes in every build. No classifier, no
# renderer, no embedded Lean wall — this keeps ordinary (non-certify)
# compiler builds free of the certificate engine.
plans = ["dep:wasm-encoder"]
engine = ["plans", "dep:sha2", "dep:wasmparser"]
producer = ["engine"]
verify = [
    "dep:sha2",
    "dep:clap",
    "dep:colored",
    "dep:serde_json",
    "dep:wasmparser",
]

[[bin]]
name = "aver-cert"
path = "src/main.rs"
required-features = ["verify"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
wasm-encoder = { version = "0.248", optional = true }
wasmparser = { version = "0.248", optional = true }

[dev-dependencies]
sha2 = "0.10"
wat = "1"
