name: Imported effects diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  observe:
    if: github.head_ref == 'feat/yield-imported-effects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl -sSfL --retry 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat aver-cert/assets/wall/current/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --bin aver
      - name: Observe and prove imported effects
        run: |
          target/debug/aver verify tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects
          target/debug/aver proof tests/fixtures/yield_imported_effects/main.av --module-root tests/fixtures/yield_imported_effects --backend lean --check --sorry-budget 0 -o /tmp/imported-effects-proof
      - name: Inspect imported entry and splice goals
        if: failure()
        run: |
          cd /tmp/imported-effects-proof
          python3 - <<'PYPROBE'
          from pathlib import Path
          import re
          import subprocess
          text = Path('Wrapper.lean').read_text().replace('namespace Wrapper', 'set_option linter.unusedSimpArgs false\nnamespace Wrapper', 1)
          lines = text.splitlines()
          def probe(name, source):
              Path(name + '.lean').write_text(source)
              result = subprocess.run(['lake', 'env', 'lean', name + '.lean'], timeout=90, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              Path(name + '.lean.log').write_text(result.stdout)
              print(name, 'EXIT', result.returncode, flush=True)
              print('\n'.join(line for line in result.stdout.splitlines() if 'error:' in line or line.startswith('case ')), flush=True)
          index = next(i for i, line in enumerate(lines) if line.startswith('theorem __aver_reason_') and '_law_correspondence_because2 :' in line)
          first = next(i for i in range(index, len(lines)) if lines[i] == '  first')
          tactic = next(line.strip()[2:] for line in lines[first:] if line.strip().startswith('| (simp only [Bool.and_eq_true') and 'List.length_drop, List.append_assoc' in line)
          probe('WrapperEntry', '\n'.join(lines[:first]) + '\n  ' + tactic + '\nend Wrapper\n')
          index = next(i for i, line in enumerate(lines) if line.startswith('theorem __aver_reason_') and 'Observed_law_splice_implication :' in line)
          tactic = next(line.strip()[2:] for line in lines[index:] if line.strip().startswith('| (first | (simp only [beq_iff_eq') and 'fun_induction' in line)
          prefix = text.split('-- verify law ')[0] + lines[index] + '\n  intro outcome inputs position events consumed\n  '
          probe('WrapperSplice', prefix + tactic + '\nend Wrapper\n')
          protected = re.search(r'simp_all \+zetaDelta only \[([^]]*)\]', tactic).group(1)
          steps = tactic.split("; all_goals (repeat' first")[0]
          steps += "; all_goals (repeat' first | assumption | rfl | (simp_all +zetaDelta only [" + protected + "]) | split at *); all_goals trace_state; all_goals sorry))"
          probe('WrapperSpliceSteps', prefix + steps + '\nend Wrapper\n')
          PYPROBE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-effects-proof
          path: |
            /tmp/imported-effects-proof/**/*.lean
            /tmp/imported-effects-proof/*.json
            /tmp/imported-effects-proof/*.log
            /tmp/imported-effects-proof/lean-toolchain
