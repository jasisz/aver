name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude aver-lang -- -D warnings && cargo clippy -p aver-lang --lib --bin aver -- -D warnings

      - name: Test
        # Iron — Stage 4: CI exercises proptest sweeps at 2 000 cases
        # per property instead of the 256-case default. The matcher
        # invariants (`types::checker::tests`) and replay-codec
        # round-trip (`tests/replay_proptest.rs`) each surfaced real
        # bugs inside 256 cases; bumping the budget here lets CI sweep
        # ~8× deeper input space than a developer's local cycle does,
        # surfacing shapes that only fire at low probability. Local
        # `cargo test` keeps the 256 default for fast iteration. 2 000
        # is conservative — 10 000 was the first instinct but risked
        # tipping the Check & Test runtime past the rest of the gates;
        # the per-test runtime gap of 256 vs 2 000 is in the seconds,
        # 2 000 vs 10 000 is in the minutes for the heavier codec
        # roundtrip tests. Bump again if a class of bug slips at 2 000.
        env:
          PROPTEST_CASES: '2000'
        run: cargo test --workspace

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install WASM tools
        env:
          BINARYEN_VERSION: version_129
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o binaryen.tar.gz
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          test -x "$PWD/binaryen-${BINARYEN_VERSION}/bin/wasm-merge"
          test -x "$PWD/binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          test -x "$PWD/binaryen-${BINARYEN_VERSION}/bin/wasm-metadce"

      - name: Clippy (wasm)
        run: cargo clippy -p aver-lang --lib --bin aver --features wasm -- -D warnings

      - name: Test (wasm)
        # Same proptest budget as the Check & Test job — applies to
        # any wasm-feature-gated proptest fixtures the feature flag
        # pulls in. No-op for non-proptest tests.
        env:
          PROPTEST_CASES: '2000'
        run: cargo test -p aver-lang --features wasm

      - name: Build (wasm release)
        run: cargo build -p aver-lang --features wasm --release

  bench:
    name: Bench Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aver (release)
        run: cargo build --release --bin aver

      - name: Run bench scenarios
        # `--baseline-dir bench/baselines/` auto-picks the file matching
        # this runner's host (`<os>-<arch>-vm.json`). When no matching
        # baseline exists, the bench run still produces reports but the
        # gate is silently skipped — first run on a new host won't fail
        # the build, just won't gate. To pin a Linux baseline, run
        # `aver bench bench/scenarios/ --target=vm --json --save-baseline
        # bench/baselines/linux-x86_64-vm.json` on this runner and
        # commit the result.
        run: |
          ./target/release/aver bench bench/scenarios/ \
            --target=vm \
            --baseline-dir bench/baselines/ \
            --fail-on-regression \
            --json | tee bench-results.ndjson

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.ndjson
          retention-days: 30

  proof:
    # Iron — C4: proof-export CI gate. `tests/proof_spec.rs` already
    # carries 7 Lake-build smoke tests that emit Lean from real Aver
    # examples and run `lake build` on the output. Locally they skip
    # cleanly when `lake` isn't on PATH; on CI we install Lean (via
    # elan, the Lean toolchain manager) so the tests exercise the
    # real proof build pipeline and a regression in proof codegen
    # surfaces as a red CI gate instead of silent green.
    name: Proof Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Lean (via elan)
        # Elan with a real default toolchain — `--default-toolchain none`
        # leaves `lake` as a wrapper that errors on every call because
        # it has no toolchain to delegate to (works for a project dir
        # with its own `lean-toolchain` file, broken for the upfront
        # `lake --version` sanity check). Pinning `stable` makes the
        # bare-PATH lake binary executable; emitted proof projects with
        # a different `lean-toolchain` still trigger elan to fetch the
        # matching version on first `lake build`.
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify `lake` reachable
        run: lake --version

      - name: Run proof-export smoke tests
        # Restricting to the proof_spec target keeps this job short
        # (no overlap with the lib / wasm / bench jobs). The tests
        # invoke `aver proof <example> --target lean`, then `lake
        # build` against the emitted directory; a Lean-side compile
        # error in any of the 7 fixtures fails the job.
        run: cargo test -p aver-lang --test proof_spec
