name: Certification

on:
  # Release candidates get the complete matrix on their exact commit. A push
  # to main runs the ready-to-merge set (see `decide`); the complete matrix
  # stays on the twice-daily cadence below, avoiding 330 lane-min for every
  # merge while making the release gate explicit and reproducible.
  push:
    branches: [main, 'release/**']
  # `labeled` starts the ready-to-merge set when a pull request gets the
  # `ready-to-merge` label, without running the per-push lanes again.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  # The full matrix runs on a timer rather than on every push to main. It is
  # Hundreds of minutes of kernel work, on a runner pool shared with
  # every other workflow here, so paying it per push made each pull request
  # queue behind roughly forty minutes of certification that almost never
  # changed. The guard in `decide` skips the run outright when main has not
  # moved since the last one, so a quiet stretch costs nothing. Twice a day,
  # late evening and night, at uneven minutes: every six hours put two of
  # the four runs, about forty jobs each, into the working day.
  schedule:
    - cron: '7 21 * * *'
    - cron: '37 1 * * *'
  workflow_dispatch:

# A labeled run has a group of its own, so labelling a pull request does not
# cancel the lanes of its last push, and that push's lanes do not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && '-labeled' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    name: Decide lanes
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
      ready: ${{ steps.pick.outputs.ready }}
      pack: ${{ steps.pick.outputs.pack }}
      ready_state: ${{ steps.pick.outputs.ready_state }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the lane partitions still cover every test
        run: |
          python3 - <<'EOF'
          import json, re, sys
          lanes = json.load(open('.github/cert-lanes.json'))
          # The comment on cert-kernel promises each suite's shards are disjoint
          # and exhaustive — no overlap doubling kernel work, no gap silently
          # dropping a soundness gate. That held while the shards sat in the
          # matrix literal and a reviewer could see them together; now they live
          # in a data file, so the promise is checked instead of stated.
          groups = {}
          for lane in lanes:
              part = lane.get('partition')
              if not part:
                  continue
              k, n = (int(x) for x in part.split('/'))
              family = re.sub(r'-\d+/\d+$', '', lane.get('lane') or '')
              groups.setdefault((lane['suite'], family, n), set()).add(k)
          bad = []
          for (suite, family, n), seen in sorted(groups.items()):
              if seen != set(range(1, n + 1)):
                  bad.append(f"{suite} {family}: expected 1..{n}, got {sorted(seen)}")
          if not any(lane.get('smoke') for lane in lanes):
              bad.append("no lane is marked smoke — every pull request would run nothing")
          # A ready lane names its tests one by one. A renamed or deleted test
          # would silently leave the ready-to-merge set, so every name has to
          # still be a test of its suite, listed once.
          seen = set()
          for lane in lanes:
              if lane.get('ready') and lane.get('smoke'):
                  bad.append(f"{lane['lane']}: a ready lane runs before merge, not on every push; it cannot be smoke")
              names = re.findall(r'test\(=([A-Za-z0-9_:]+)\)', lane.get('filter') or '')
              if not names:
                  continue
              source = open(f"tests/{lane['suite']}.rs").read()
              for name in names:
                  if not re.search(rf'\bfn {re.escape(name)}\(', source):
                      bad.append(f"{lane['suite']} {lane['lane']}: no test named {name}")
                  if (lane['suite'], name) in seen:
                      bad.append(f"{lane['suite']}: {name} is named by two lanes")
                  seen.add((lane['suite'], name))
          # Every certificate suite runs here, where Lean is installed. A suite
          # without a lane would run only in ci.yml, whose runners have no
          # `lake`, and its Lean-backed tests would skip there without a word.
          # The one exception carries no Lean test.
          import glob, os
          no_lean = {'cert_delegate_spec', 'cert_one_build_spec'}  # no Lean: byte identity runs in ci.yml's wasm-gc lane
          laned = {lane['suite'] for lane in lanes}
          for path in sorted(glob.glob('tests/cert_*.rs')):
              suite = os.path.splitext(os.path.basename(path))[0]
              if suite not in laned and suite not in no_lean:
                  bad.append(f"{suite} has no lane in .github/cert-lanes.json")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(lanes)} lanes, {len(groups)} partitioned families, all complete")
          EOF

      - name: Pick lanes for this event
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # Three sets of lanes, marked in .github/cert-lanes.json rather than
          # listed here, so the file stays the single source and a lane cannot
          # be dropped from one place and kept in the other:
          #   * smoke: every push to a pull request. The cheap lanes that
          #     still reach every suite, and the guard-isolation lanes, whose
          #     failures are soundness regressions.
          #   * ready: the `ready-*` lanes, one hardening tamper per attack
          #     class plus the acceptance controls. Each takes 9 to 17
          #     minutes, because most declines rebuild the wall from clean.
          #   * full: every lane but the ready ones, whose tests the full
          #     hardening slices already run. The schedule, manual runs and
          #     every release candidate (`release/**`) run it.
          # The ready lanes and the Wasmtime pack test (`pack`, 17 minutes)
          # are the ready-to-merge set. A pull request runs it once it has the
          # `ready-to-merge` label, on the labelling and on every later push,
          # and every push to main runs it. Keeping it off the other pushes
          # keeps one push within twenty minutes when the runners are busy.
          smoke=$(jq -c '[.[] | select(.smoke and (.ready | not))]' .github/cert-lanes.json)
          ready=$(jq -c '[.[] | select(.ready)]' .github/cert-lanes.json)
          full=$(jq -c '[.[] | select(.ready | not)]' .github/cert-lanes.json)

          if [ "$EVENT" = "pull_request" ]; then
            # A pull request whose every changed path is outside the
            # certificate's reach (tools/ci_pr_gate.py lists those paths)
            # runs no certificate lane, and the pack runs only when a changed
            # path feeds it. An unreadable file list runs both.
            files=$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=""
            # The API lists at most 3000 files; past that the list is not the whole PR.
            if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ]; then files=""; fi
            cert=$(printf '%s\n' "$files" | python3 tools/ci_pr_gate.py cert)
            pack=$(printf '%s\n' "$files" | python3 tools/ci_pr_gate.py pack)
            if [ "$cert" = "false" ]; then
              echo "every changed path is outside the certificate's reach — no lane runs"
              printf '%s\n' "$files"
              smoke='[]'; ready='[]'
            fi
            # A labeled run carries the ready-to-merge set only: the lanes of
            # the last push run in that push's own run.
            if [ "$ACTION" = "labeled" ]; then smoke='[]'; fi
            # A label given when the pull request is opened arrives as its own
            # `labeled` event, and that run carries the set.
            if [ "$LABELLED" != "true" ] || [ "$ACTION" = "opened" ]; then
              echo "no ready-to-merge label: the ready-to-merge set does not run"
              out lanes "$smoke"; out ready '[]'; out pack false; out ready_state unlabelled
              exit 0
            fi
            out lanes "$smoke"; out ready "$ready"; out pack "$pack"; out ready_state run
            exit 0
          fi

          if [ "$EVENT" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            out lanes '[]'; out ready "$ready"; out pack true; out ready_state run
            exit 0
          fi

          # Scheduled run: certify main only if it moved. `head_sha` of the last
          # successful scheduled run is the last commit this suite passed on.
          if [ "$EVENT" = "schedule" ]; then
            last=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/cert.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$last" = "${{ github.sha }}" ]; then
              echo "main unchanged since ${last} — nothing to certify"
              out lanes '[]'; out ready '[]'; out pack false; out ready_state run
              exit 0
            fi
          fi

          out lanes "$full"; out ready '[]'; out pack true; out ready_state run

  cert-kernel:
    needs: decide
    if: needs.decide.outputs.lanes != '[]'
    # Every lane is a name filter plus a slice partition. Each filter and its
    # suite-specific complement are disjoint and exhaustive, so each test in a
    # suite is selected exactly once: no overlap (which would double the kernel
    # work) and no gap (which would silently stop running a soundness gate).
    #
    # Five families are prefix-selected onto dedicated runners because their
    # members are long kernel runs:
    #   * `cert_hostile_model_` (certify) — the hostile obligation-model gates;
    #   * `cert_adt_witness_`   (certify) — one `lake build` of an emitted
    #     certificate per non-recursive ADT fixture, ten of them;
    #   * `cert_projects_`      (certify) — a whole real project tree certified
    #     and checked. This is the single longest Lean build in the workflow,
    #     and it used to share the `rest` lane, where nextest ran it beside
    #     several other certificate builds; the contention pushed one `lake`
    #     step past the verifier's 900-second per-phase limit and declined the
    #     package for a reason that had nothing to do with the certificate. Its
    #     own lane gives it the runner to itself, and `phase_timeout_secs`
    #     raises the per-step limit for that lane only, so the fail-closed
    #     default stays where it is everywhere else;
    #   * `cert_plans_authority_` (verify) — the Plans.lean-authority gates,
    #     one full certificate verification each;
    #   * `cert_tripwire_` (verify) — the tampering classes of `aver cert
    #     verify`, one gate per test. Twenty-three of them pay a full artifact
    #     DATA build (a tamper of Lean source inside the certificate, or a gate
    #     that must be ACCEPTED); the other nine are decided by the Rust
    #     verifier before any Lean process starts and cost milliseconds. Slice
    #     partitioning is round-robin over the sorted names, which spreads the
    #     expensive ones four or five to a lane.
    # The `rest` lane of each suite excludes exactly those prefixes. Prefix in,
    # prefix out. A model or fixture added to the lists inside a suite lands in
    # an existing shard test, so these lanes never need editing for coverage —
    # only to add throughput.
    # The hardening suite is also sliced: the unsplit suite exceeded the
    # job's hour limit while tests were still passing. The eight slices run
    # in the full matrix. Before merge and on main the `ready-*` lanes run
    # instead (job `cert-ready` below), which name one tamper per attack class
    # plus the acceptance controls (most declines cost a cold rebuild of the
    # wall, because the checker retries a failed cache-assisted build from
    # clean). All tests and verifier limits stay unchanged.
    name: Cert Kernel (${{ matrix.suite }}${{ matrix.lane && format(' {0}', matrix.lane) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The scheduled full matrix takes at most eight runners at a time, so a
      # pull request opened while it runs still finds runners free. A pull
      # request's own smoke lanes are not limited.
      max-parallel: ${{ github.event_name == 'schedule' && 8 || 64 }}
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.lanes) }}
    # `cert-ready` runs these same steps through the anchors.
    env: &cert-env
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
      # Lean is installed on these runners, so a certificate test that finds
      # no `lake` fails instead of skipping.
      AVER_CERT_REQUIRE_LEAN: '1'
    steps: &cert-steps
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Lean toolchain
        # The verifier's production default remains a clean Lake build. Tests
        # may copy an exact-byte-keyed pristine prelude cache into fresh builds;
        # the Lean toolchain download is cached separately here.
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/lean-toolchain') }}

      - name: Install Lean (via elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache wasm-tools
        id: cache-wasm-tools
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-1.246.2

      - name: Install wasm-tools
        # Retrying was not enough on its own: a run burned all six attempts
        # over ninety seconds against a releases CDN that stayed down for
        # longer than that. A pinned binary does not need re-fetching every
        # run, so the cache above removes the download from the common path
        # and the retry only covers a genuine cache miss.
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools "$HOME/.local/bin/wasm-tools"

      - name: Put wasm-tools on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-tools" --version

      - name: Verify pinned `lake` reachable
        run: |
          toolchain="$(tr -d '\r\n' < aver-cert/assets/wall/current/lean-toolchain)"
          for attempt in 1 2 3 4 5 6; do
            if elan run --install "$toolchain" lake --version; then exit 0; fi
            echo "::warning::pinned lake/toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::pinned lake unreachable after 6 attempts (toolchain download)"
          exit 1

      - name: Cache prebuilt prelude store
        # The test harness's exact-byte-keyed pristine prelude store: a stale
        # or mismatching entry is a harmless miss (the key is a content hash of
        # the staged audited bytes), so caching across runs only saves the
        # per-job pristine build.
        uses: actions/cache@v4
        with:
          path: /tmp/aver-cert-prelude-store
          key: prelude-store-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/**', 'aver-cert/src/verifier.rs', 'aver-cert/src/prelude_cache.rs', 'aver-cert/src/lean_process.rs') }}

      - name: Cache the guard probes' wall seed
        # The guard-isolation probes run `lake build` themselves, outside the
        # checker. tests/support/wall_seed.rs builds the artifact-independent
        # wall once into this store and copies it into each probe; the copy is
        # checked against the manifest written when the seed was built, and a
        # mismatch fails the test. The key covers the wall sources and
        # `lean-toolchain` (both under wall/current), the root list in wall.rs
        # and the seed layout, so any change to them builds a fresh seed.
        # The checker and `aver-cert verify` never read this store.
        if: matrix.suite == 'cert_whole_module_guard_iso'
        uses: actions/cache@v4
        with:
          path: /tmp/aver-test-wall-seed
          key: wall-seed-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/**', 'aver-cert/src/wall.rs', 'tests/support/wall_seed.rs') }}

      - name: Install nextest
        if: matrix.mode == 'nextest'
        uses: taiki-e/install-action@nextest

      - name: Build standalone certificate verifier
        run: cargo build -p aver-cert --bin aver-cert

      - name: Verify hostile Lean search paths are isolated
        if: matrix.suite == 'cert_decode_spec'
        env:
          AVER_CERT_REQUIRE_PINNED_LEAN: '1'
        run: >-
          cargo test -p aver-cert --lib --features verify
          lean_process::tests::hostile_lean_path_olean_is_not_visible -- --exact

      - name: Run certification suite
        if: matrix.mode == 'cargo'
        run: cargo test -p aver-lang --features ${{ matrix.features || 'wasm' }} --test ${{ matrix.suite }}

      - name: Run certification suite lane
        # Filtering happens before slice partitioning. Each family filter (one
        # of the `cert_hostile_model_`, `cert_adt_witness_`, `cert_projects_`,
        # `cert_tripwire_` and `cert_plans_authority_` prefixes) and its
        # suite-specific complement are disjoint and exhaustive.
        #
        # A lane may raise the verifier's per-Lean-step wall-clock limit
        # through `phase_timeout_secs`; every other lane keeps the built-in
        # 900-second default, spelled here so the value in force is visible.
        if: matrix.mode == 'nextest'
        env:
          AVER_CERT_PHASE_TIMEOUT_SECS: ${{ matrix.phase_timeout_secs || 900 }}
          AVER_TEST_WALL_SEED: /tmp/aver-test-wall-seed
        run: >-
          cargo nextest run -p aver-lang --features ${{ matrix.features || 'wasm' }} --test ${{ matrix.suite }}
          -E '${{ matrix.filter }}'
          --partition slice:${{ matrix.partition }}

      - name: Run wasip2 certificate tests
        # The verify/certify shards use only wasm, so their wasip2-only
        # tripwire and snapshot are absent there. Reuse the first hardening
        # shard's wasm,wasip2 build and Lean setup, without another job
        # or repeating these tests in every hardening shard.
        if: matrix.wasip2_tests == true
        run: >-
          cargo test -p aver-lang --features wasm,wasip2 --test cert_verify_spec
          --test cert_certify_spec wasip2

  cert-ready:
    # The ready-to-merge certificate lanes: the steps of `cert-kernel` over the
    # `ready` lanes that `decide` picked. A job of their own, so that
    # `Cert ready-to-merge` can tell their result from the per-push lanes'.
    needs: decide
    if: needs.decide.outputs.ready != '[]'
    name: Cert Kernel (${{ matrix.suite }} ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.ready) }}
    env: *cert-env
    steps: *cert-steps

  pack:
    # The Wasmtime deployment pack test builds two release Wasmtime hosts from
    # a fresh cache, which is the cache-isolation contract it tests, so its
    # fourteen to seventeen minutes cannot be cached away. It belongs to the
    # ready-to-merge set, and a pull request runs it only when a changed path
    # feeds the pack (tools/ci_pr_gate.py lists those paths).
    name: WASM (pack)
    needs: decide
    if: needs.decide.outputs.pack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-pack

      - name: Cache binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: ~/.local/binaryen
          key: binaryen-${{ runner.os }}-version_129

      - name: Install WASM tools
        env:
          BINARYEN_VERSION: version_129
        run: |
          if [ ! -x "$HOME/.local/binaryen/bin/wasm-opt" ]; then
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
              "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o binaryen.tar.gz
            tar -xzf binaryen.tar.gz
            mkdir -p "$HOME/.local"
            rm -rf "$HOME/.local/binaryen"
            mv "binaryen-${BINARYEN_VERSION}" "$HOME/.local/binaryen"
          fi
          echo "$HOME/.local/binaryen/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/binaryen/bin/wasm-opt"

      - name: Prefetch provider-host feature graph
        # The pack builds generated hosts with Cargo offline.
        run: cargo fetch --locked

      - name: Test Wasmtime deployment packs
        timeout-minutes: 35
        # This test builds real release hosts with standard and custom
        # providers in a fresh cache, then checks deployment, artifact binding
        # and cache isolation. Keep that coverage and its fresh-cache contract.
        run: |
          cargo build -p aver-cert --bin aver-cert
          cargo test -p aver-lang --features wasm --test wasmtime_pack_spec

  ready:
    # One check under a fixed name for the whole ready-to-merge set, to be
    # read by name before a merge. On a pull request without the
    # `ready-to-merge` label it is skipped, so it reads as not run rather than
    # as passed. It fails on a failed, cancelled or skipped lane it needed.
    name: Cert ready-to-merge
    needs: [decide, cert-ready, pack]
    if: always() && needs.decide.outputs.ready_state != 'unlabelled'
    runs-on: ubuntu-latest
    steps:
      - name: Require every ready-to-merge lane
        env:
          DECIDE: ${{ needs.decide.result }}
          READY_LANES: ${{ needs.decide.outputs.ready }}
          READY: ${{ needs.cert-ready.result }}
          PACK_WANTED: ${{ needs.decide.outputs.pack }}
          PACK: ${{ needs.pack.result }}
        run: |
          echo "decide: $DECIDE, certificate lanes: $READY, pack: $PACK"
          test "$DECIDE" = success
          if [ "$READY_LANES" != "[]" ]; then test "$READY" = success; fi
          if [ "$PACK_WANTED" = "true" ]; then test "$PACK" = success; fi
