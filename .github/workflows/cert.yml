name: Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cert-kernel:
    # Every lane is a name filter plus a slice partition. Each filter and its
    # suite-specific complement are disjoint and exhaustive, so each test in a
    # suite is selected exactly once: no overlap (which would double the kernel
    # work) and no gap (which would silently stop running a soundness gate).
    #
    # Three families are prefix-selected onto dedicated runners because their
    # members are long kernel runs:
    #   * `cert_hostile_model_` (certify) — the hostile obligation-model gates;
    #   * `cert_adt_witness_`   (certify) — one `lake build` of an emitted
    #     certificate per non-recursive ADT fixture, ten of them;
    #   * `cert_plans_authority_` (verify) — the Plans.lean-authority gates,
    #     one full certificate verification each.
    # The `rest` lane of each suite excludes exactly those prefixes. Prefix in,
    # prefix out. A model or fixture added to the lists inside a suite lands in
    # an existing shard test, so these lanes never need editing for coverage —
    # only to add throughput.
    #
    # The remaining verify monster test, `cert_verify_accepts_and_tripwires_
    # fail_closed`, still gets a dedicated runner by exact name.
    name: Cert Kernel (${{ matrix.suite }}${{ matrix.lane && format(' {0}', matrix.lane) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cert_certify_spec
            lane: hostile-models-1/5
            mode: nextest
            filter: 'test(/^cert_hostile_model_/)'
            partition: 1/5
          - suite: cert_certify_spec
            lane: hostile-models-2/5
            mode: nextest
            filter: 'test(/^cert_hostile_model_/)'
            partition: 2/5
          - suite: cert_certify_spec
            lane: hostile-models-3/5
            mode: nextest
            filter: 'test(/^cert_hostile_model_/)'
            partition: 3/5
          - suite: cert_certify_spec
            lane: hostile-models-4/5
            mode: nextest
            filter: 'test(/^cert_hostile_model_/)'
            partition: 4/5
          - suite: cert_certify_spec
            lane: hostile-models-5/5
            mode: nextest
            filter: 'test(/^cert_hostile_model_/)'
            partition: 5/5
          - suite: cert_certify_spec
            lane: adt-witnesses-1/4
            mode: nextest
            filter: 'test(/^cert_adt_witness_/)'
            partition: 1/4
          - suite: cert_certify_spec
            lane: adt-witnesses-2/4
            mode: nextest
            filter: 'test(/^cert_adt_witness_/)'
            partition: 2/4
          - suite: cert_certify_spec
            lane: adt-witnesses-3/4
            mode: nextest
            filter: 'test(/^cert_adt_witness_/)'
            partition: 3/4
          - suite: cert_certify_spec
            lane: adt-witnesses-4/4
            mode: nextest
            filter: 'test(/^cert_adt_witness_/)'
            partition: 4/4
          - suite: cert_certify_spec
            lane: rest
            mode: nextest
            filter: 'not (test(/^cert_hostile_model_/) or test(/^cert_adt_witness_/))'
            partition: 1/1
          - suite: cert_decode_spec
            lane: ''
            mode: cargo
          - suite: cert_toindex_differential
            lane: ''
            mode: cargo
          - suite: cert_whole_module_guard_iso
            lane: ''
            mode: cargo
          - suite: cert_verify_spec
            lane: tripwires
            mode: nextest
            filter: 'test(=cert_verify_accepts_and_tripwires_fail_closed)'
            partition: 1/1
          - suite: cert_verify_spec
            lane: plans-authority-1/3
            mode: nextest
            filter: 'test(/^cert_plans_authority_/)'
            partition: 1/3
          - suite: cert_verify_spec
            lane: plans-authority-2/3
            mode: nextest
            filter: 'test(/^cert_plans_authority_/)'
            partition: 2/3
          - suite: cert_verify_spec
            lane: plans-authority-3/3
            mode: nextest
            filter: 'test(/^cert_plans_authority_/)'
            partition: 3/3
          - suite: cert_verify_spec
            lane: rest-1/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 1/8
          - suite: cert_verify_spec
            lane: rest-2/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 2/8
          - suite: cert_verify_spec
            lane: rest-3/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 3/8
          - suite: cert_verify_spec
            lane: rest-4/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 4/8
          - suite: cert_verify_spec
            lane: rest-5/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 5/8
          - suite: cert_verify_spec
            lane: rest-6/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 6/8
          - suite: cert_verify_spec
            lane: rest-7/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 7/8
          - suite: cert_verify_spec
            lane: rest-8/8
            mode: nextest
            filter: 'not (test(=cert_verify_accepts_and_tripwires_fail_closed) or test(/^cert_plans_authority_/))'
            partition: 8/8
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Lean toolchain
        # The verifier's production default remains a clean Lake build. Tests
        # may copy an exact-byte-keyed pristine prelude cache into fresh builds;
        # the Lean toolchain download is cached separately here.
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/lean-toolchain') }}

      - name: Install Lean (via elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        # Only the decode differential suite shells out to `wasm-tools print`
        # (tools/certkit/decode_ref.py); harmless to install for the others.
        if: matrix.suite == 'cert_decode_spec'
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-1.246.2-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Verify pinned `lake` reachable
        run: |
          toolchain="$(tr -d '\r\n' < aver-cert/assets/wall/current/lean-toolchain)"
          for attempt in 1 2 3 4 5 6; do
            if elan run --install "$toolchain" lake --version; then exit 0; fi
            echo "::warning::pinned lake/toolchain fetch failed (attempt ${attempt}/6); retrying in 15s"
            sleep 15
          done
          echo "::error::pinned lake unreachable after 6 attempts (toolchain download)"
          exit 1

      - name: Cache prebuilt prelude store
        # The test harness's exact-byte-keyed pristine prelude store: a stale
        # or mismatching entry is a harmless miss (the key is a content hash of
        # the staged audited bytes), so caching across runs only saves the
        # per-job pristine build.
        uses: actions/cache@v4
        with:
          path: /tmp/aver-cert-prelude-store
          key: prelude-store-${{ runner.os }}-${{ hashFiles('aver-cert/assets/wall/current/**', 'aver-cert/src/verifier.rs', 'aver-cert/src/prelude_cache.rs', 'aver-cert/src/lean_process.rs') }}

      - name: Install nextest
        if: matrix.mode == 'nextest'
        uses: taiki-e/install-action@nextest

      - name: Build standalone certificate verifier
        run: cargo build -p aver-cert --bin aver-cert

      - name: Verify hostile Lean search paths are isolated
        if: matrix.suite == 'cert_decode_spec'
        env:
          AVER_CERT_REQUIRE_PINNED_LEAN: '1'
        run: >-
          cargo test -p aver-cert --lib --features verify
          lean_process::tests::hostile_lean_path_olean_is_not_visible -- --exact

      - name: Run certification suite
        if: matrix.mode == 'cargo'
        run: cargo test -p aver-lang --features wasm --test ${{ matrix.suite }}

      - name: Run certification suite lane
        # Filtering happens before slice partitioning. Each monster-test filter
        # (exact name, or one of the `cert_hostile_model_`, `cert_adt_witness_`
        # and `cert_plans_authority_` prefixes) and its suite-specific
        # complement are disjoint and exhaustive.
        if: matrix.mode == 'nextest'
        run: >-
          cargo nextest run -p aver-lang --features wasm --test ${{ matrix.suite }}
          -E '${{ matrix.filter }}'
          --partition slice:${{ matrix.partition }}
