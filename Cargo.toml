[workspace]
members = [".", "aver-cert", "aver-lsp", "aver-rt", "aver-memory"]
exclude = ["tools/wasm-runner", "fuzz"]

[package]
name = "aver-lang"
version = "0.30.0-dev"
edition = "2024"
default-run = "aver"
description = "VM and transpiler for Aver, a statically-typed language designed for AI-assisted development"
license = "MIT"
repository = "https://github.com/jasisz/aver"
homepage = "https://github.com/jasisz/aver"
documentation = "https://docs.rs/aver-lang"
readme = "README.md"
keywords = ["language", "interpreter", "transpiler", "programming-language"]
categories = ["compilers"]
include = [
    "/src/**",
    "!/src/bin/**",
    "/stdlib/**",
    "/wit/**",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    # Agent material shipped inside the binary. `src/main/agent_connect.rs`
    # `include_str!`s all three, so `aver agent-connect` works from a
    # `cargo install aver-lang` with no repository checkout. Cargo does
    # package dot-directories when they are named explicitly here
    # (verified with `cargo package --list`), so the skill sources need no
    # generated mirror under `src/`.
    "/.claude/commands/aver.md",
    "/.claude/commands/aver-tooling.md",
    "/tools/website/llms.txt",
]

[lib]
name = "aver"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aver"
path = "src/main.rs"
required-features = ["runtime", "terminal", "tty-render"]

[[bin]]
name = "aver_self_host_cli"
path = "src/self_host/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime", "runtime-net", "terminal", "tty-render"]
runtime = ["dep:aver-rt", "aver-memory/runtime", "aver-rt/random", "dep:clap", "dep:rayon", "dep:toml"]
runtime-net = ["runtime", "aver-rt/http"]
terminal = ["aver-rt/terminal"]
tty-render = ["dep:colored"]
wasm = ["wasm-compile", "certify", "dep:wasmtime"]
wasm-compile = ["dep:aver-cert", "dep:wasm-encoder", "dep:wasmprinter", "dep:wasmparser", "dep:wat"]
# Certificate production (`aver compile --certify`). Pulls the full aver-cert
# engine (classifier, Lean renderer, embedded soundness wall) on top of the
# wasm-gc compile pipeline it certifies, so `--features certify` is a
# complete, compilable combination on its own. Deliberately NOT part of
# `wasm-compile` itself, so browser/component builds (`playground`,
# `wasip2`) link only the plan surface the wasm-gc emitter needs.
certify = ["wasm-compile", "aver-cert/producer"]
# 0.18 "Span" — `--target wasip2` (WASI 0.2 Component Model output).
# Direct WIT lowering: the wasm-gc backend emits a core module in
# canonical-ABI-compatible shapes, we embed a `component-type:<world>`
# custom section (encoded via `wit-component::metadata`) describing
# the WIT world, and `wit-component::ComponentEncoder` produces the
# component without a preview1 adapter. Aver effects map directly
# to WIT/WASI imports — there is no preview1 ABI to preserve. See
# docs/wasip2.md for the contract and feedback_aver_no_preview1_adapter
# for the architectural rationale.
wasip2 = ["wasm-compile", "dep:wit-component", "dep:wit-encoder", "dep:wit-parser", "dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http"]
playground = ["wasm-compile", "dep:wasm-bindgen", "runtime", "tty-render"]

[dependencies]
aver-cert = { path = "aver-cert", version = "=0.1.5-dev", optional = true, default-features = false, features = ["plans"] }
aver-memory = { path = "aver-memory", version = "=0.2.16-dev" }
aver-rt = { path = "aver-rt", version = "=0.4.12-dev", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
num-bigint = "0.4"
num-traits = "0.2"
rayon = { version = "1", optional = true }
thiserror = "1"
toml = { version = "0.8", optional = true }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wasm-bindgen = { version = "0.2", optional = true }
wasm-encoder = { version = "0.248", optional = true }
wasmparser = { version = "0.248", optional = true }
wasmprinter = { version = "0.248", optional = true }
sha2 = "0.10"
# `gc-copying` (not `gc-drc`): Wasmtime's copying collector is the
# default and it is what the standalone wasmtime CLI runs. On the
# 1 MiB hex-decode benchmark the DRC collector is ~13x slower
# than copying (~5.5s vs ~0.42s), so the collector choice is
# load-bearing for `aver run --wasm-gc` / `--wasip2` throughput.
wasmtime = { version = "48.0.1", optional = true, default-features = false, features = ["cache", "cranelift", "runtime", "gc", "gc-copying", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "48.0.1", optional = true }
wasmtime-wasi-http = { version = "48.0.1", optional = true }
wat = { version = "1", optional = true }
# wasip2 feature deps — versions paired by upstream wasm-tools 1.248
# release train. `wasi-preview1-component-adapter-provider` is NOT
# a dep: Aver effects lower directly to WIT/WASI imports, no
# preview1 adapter wrap (see feedback_aver_no_preview1_adapter).
wit-component = { version = "0.248", optional = true }
wit-encoder = { version = "0.248", optional = true }
wit-parser = { version = "0.248", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
native-provider-fixture = { path = "tests/fixtures/native_provider_host" }
# Iron (0.21) — property-based testing for type-checker matcher
# invariants + Type AST generation. Defaults to 256 cases per
# `proptest!` block; the CI gate bumps that to 10_000 via the
# `PROPTEST_CASES` env var, and developers can shrink locally for
# fast iteration.
proptest = "1"
tempfile = "3"

[[bench]]
name = "nan_value_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false
required-features = ["wasm"]

[profile.release]
lto = true
codegen-units = 1
