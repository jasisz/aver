[package]
name = "aver-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Stand-alone crate — not a workspace member. Mirrors the cargo-fuzz
# convention; keeps `cargo build` at the repo root unaware of AFL.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
afl = "0.15"
# `runtime` enables `replay`; `wasm-compile` pulls in the wasm-gc
# codegen used by `fuzz_codegen_wasm_gc` (which also needs the
# `wasmparser` validator at the end of the pipeline). Sharing one
# feature set across every fuzz binary keeps the `aver-lang`
# monomorphisation to one copy.
# `wasm` pulls in the wasm-gc backend; `runtime-net` + `terminal`
# unlock the HTTP / Terminal effect import handlers `runtime::wasm_gc`
# wires unconditionally. The production `aver` bin has them via its
# `required-features`, but a lib-only build (fuzz crate consumes
# `aver-lang` as a library) has to ask explicitly. Keeping them in
# the parity build means the wasm-gc executor sees the same effect
# surface AFL might generate from real Aver corpus seeds.
aver-lang = { path = "..", default-features = false, features = ["runtime", "wasm-compile", "wasm", "wasip2", "runtime-net", "terminal"] }
# Validate codegen output bytes after `compile_to_wasm_gc`. We pin
# the same minor as `aver-lang`'s optional dep so the workspace
# resolver picks a single version.
wasmparser = "0.248"

[[bin]]
name = "fuzz_parse_bytes"
path = "fuzz_targets/parse_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_typecheck_program"
path = "fuzz_targets/typecheck_program.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_replay_codec"
path = "fuzz_targets/replay_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_codegen_wasm_gc"
path = "fuzz_targets/codegen_wasm_gc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_runner"
path = "fuzz_targets/verify_runner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parity_vm_vs_wasm_gc"
path = "fuzz_targets/parity_vm_vs_wasm_gc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_codegen_wasip2"
path = "fuzz_targets/codegen_wasip2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_replay_roundtrip"
path = "fuzz_targets/replay_roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
