# tools/edge-gc — Cloudflare Workers proof-of-concept on top of the
# wasm-gc backend. Mirrors `tools/edge/` but compiles via
# `--target wasm-gc` instead of legacy linear-memory `wasm`. The
# fractal renderer is the same module (`fractal.av` is a verbatim
# copy / future symlink); only the dispatch surface narrows down to
# a single export `handle(query: String) -> String` so the JS host
# can call it via the LM bridge.

[[check.suppress]]
slug = "missing-verify"
files = ["fractal.av"]
fns = ["page"]
reason = """
Fractal.page is a fixed HTML template — pure string assembly with no \
branching logic. Same suppression as in tools/edge/aver.toml."""
