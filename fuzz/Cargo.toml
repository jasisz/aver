[package]
name = "aver-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Stand-alone crate — not a workspace member. Mirrors the cargo-fuzz
# convention; keeps `cargo build` at the repo root unaware of AFL.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
afl = "0.15"
# `runtime` enables the `replay` module the codec target needs.
# Parser and typecheck targets don't strictly require it but the
# extra LOC cost is in the noise vs sharing one feature set across
# every fuzz binary.
aver-lang = { path = "..", default-features = false, features = ["runtime"] }

[[bin]]
name = "fuzz_parse_bytes"
path = "fuzz_targets/parse_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_typecheck_program"
path = "fuzz_targets/typecheck_program.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_replay_codec"
path = "fuzz_targets/replay_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_runner"
path = "fuzz_targets/verify_runner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parity_vm_vs_wasm_gc"
path = "fuzz_targets/parity_vm_vs_wasm_gc.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
