[package]
name = "aver-memory"
version = "0.2.12"
edition = "2024"
license = "MIT"
description = "NaN-boxed arena memory for the Aver language"
repository = "https://github.com/jasisz/aver"

[lib]
name = "aver_memory"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
runtime = ["dep:aver-rt"]

[dependencies]
aver-rt = { path = "../aver-rt", version = "=0.4.9", optional = true }
num-bigint = "0.4"
