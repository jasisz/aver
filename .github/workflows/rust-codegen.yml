name: Rust codegen

# Nightly Rust codegen regression. The first job checks a hand-picked corpus
# of single-file `examples/core/*.av` programs; the second checks the pinned
# btc-listener Work/Wait migration with current Aver. The corpus job
# materialises each project and invokes Cargo explicitly; the downstream job
# exercises the public `aver compile --target rust --check` gate. Both assert
# that emitted Rust type-checks under the real compiler.
#
# Catches the bug class where `compile_to_rust` emits syntactically
# valid but semantically broken source: missing imports, mistyped
# fn signatures, wrong trait bounds, generic drift. The
# `tests/compile_spec.rs` cancel-mode end-to-end probe runs in
# `Check & Test`; this suite is the breadth check across the core
# example corpus, run only where Rust codegen can change so the
# per-example `cargo check` (~30-60 s each) doesn't burden every PR.
#
# Sister workflow to `proof.yml`. It runs nightly against main and on
# pull requests that touch the Rust backend or what feeds it: the Rust
# emitter, shared codegen, MIR and its ownership passes, the native
# providers and capability contracts, the Aver runtime crate, yield
# lowering, and the self-hosted sources. Other PRs skip it, so ordinary
# compiler changes do not pay for the per-example `cargo check`. Neither
# job is a required check; their names are distinct from every `CI` job.

on:
  schedule:
    # 03:00 UTC daily — runs against the tip of main, same cadence
    # as fuzz nightly + proof nightly. Three independent workflows
    # each reading main, no cross-artefact deps.
    - cron: '0 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-codegen.yml'
      - 'src/codegen/rust/**'
      - 'src/codegen/common.rs'
      - 'src/codegen/mod.rs'
      - 'src/codegen/builtin*.rs'
      - 'src/ir/mir/**'
      - 'src/ir/alias.rs'
      - 'src/ir/escape.rs'
      - 'src/ir/last_use.rs'
      - 'src/yield_lowering/**'
      - 'src/provider/**'
      - 'stdlib/capabilities/**'
      - 'aver-rt/**'
      - 'self_hosted/**'
      - 'tests/rust_codegen_regression.rs'
  workflow_dispatch:

concurrency:
  # A new push to the same PR supersedes the running canary; nightly and
  # dispatched runs keep their own group and are never cancelled.
  group: rust-codegen-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-codegen:
    name: Rust codegen regression
    runs-on: ubuntu-latest
    # Scheduled runs belong to this repository. A fork with Actions enabled
    # otherwise runs our cron on its owner's account and mails them about any
    # failure. Every other trigger still works in a fork, so a contributor can
    # run this workflow on their own branch.
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache both the host workspace and the shared
          # `target/rust-codegen-regression-shared/` directory the
          # integration test reuses across corpus examples. First
          # example in the run pays full dep compile (~30 s); rest
          # are seconds because Swatinem's cache restores the
          # shared target between runs too.
          workspaces: |
            .

      - name: Build `aver` binary
        # The integration test discovers the binary via
        # `env!("CARGO_BIN_EXE_aver")`, but `cargo test --test`
        # only builds dependencies of the specific test binary —
        # not the `aver` bin. Explicitly build it first so the
        # spawned subprocess in the test finds it.
        run: cargo build --bin aver --features runtime

      - name: Run Rust codegen regression
        # `--test rust_codegen_regression` scopes the run to this
        # suite. The test panics on any corpus example whose
        # emitted Rust project fails `cargo check`, surfacing the
        # named example + the cargo check output in the failure
        # message.
        run: cargo test --test rust_codegen_regression -- --nocapture

  btc-listener-canary:
    name: Rust codegen downstream (btc-listener)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'jasisz/aver'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Pin the Work/Wait migration from n1bor/btc-listener#361. The original
      # #1172 revision predates Tcp.Socket.Sending and fails exhaustiveness
      # checking before reaching Rust codegen. Use the contributor fork while
      # the migration awaits upstream merge; keep an exact, deliberate pin.
      - uses: actions/checkout@v5
        with:
          repository: jasisz/btc-listener
          ref: 5698c8e11d9f1c09955079add0fae5b8a94eea03
          path: btc-listener

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang for the pinned RocksDB provider
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-codegen-btc-listener

      - name: Place current Aver at btc-listener's pinned dev path
        # Both downstream provider crates intentionally depend on aver-rt at
        # this absolute path; btc-listener's own CI checks out its pinned Aver
        # revision there. Clone this workflow's exact checkout locally so the
        # canary tests current Aver under the same source identity without
        # rewriting the downstream manifests.
        run: |
          sudo mkdir -p /home/owensr/aver
          sudo chown "$USER" /home/owensr/aver
          git clone --quiet --local "$GITHUB_WORKSPACE" /home/owensr/aver/aver
          git -C /home/owensr/aver/aver checkout --quiet "$GITHUB_SHA"

      - name: Build current Aver
        working-directory: /home/owensr/aver/aver
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/btc-listener-aver
        run: cargo build --locked --bin aver

      - name: Check the emitted downstream project
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/btc-listener-canary
        run: |
          target/btc-listener-aver/debug/aver compile \
            btc-listener/main.av \
            --module-root btc-listener \
            --target rust \
            --check \
            -o "$RUNNER_TEMP/btc-listener-generated"
